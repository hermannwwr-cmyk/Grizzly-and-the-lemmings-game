<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Grizzly and the Lemmings</title>
<style>
  :root { color-scheme: light; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #2e6b3a;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    font-family: "Comic Sans MS", "Chalkboard SE", "Comic Neue", sans-serif;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<script>
(() => {
  'use strict';

  // =====================================================================
  //  Setup
  // =====================================================================
  const W = 960, H = 540, GROUND = 470;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  function resize() {
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = Math.floor(W * scale) + 'px';
    canvas.style.height = Math.floor(H * scale) + 'px';
    canvas.width = Math.floor(W * scale * dpr);
    canvas.height = Math.floor(H * scale * dpr);
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };

  // Saved stickers (stars) per game. Only a convenience; works without storage.
  let stars = {};
  try { stars = JSON.parse(localStorage.getItem('grizzly-stars') || '{}') || {}; } catch (e) { stars = {}; }
  function saveStars() { try { localStorage.setItem('grizzly-stars', JSON.stringify(stars)); } catch (e) { /* ignore */ } }

  // =====================================================================
  //  Sound + voice
  // =====================================================================
  let audio = null, muted = false;
  function initAudio() {
    if (!audio) {
      try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
    }
    if (audio && audio.state === 'suspended') audio.resume();
  }
  function tone(freq, dur, type = 'sine', vol = 0.15, slide = 0, delay = 0) {
    if (!audio || muted) return;
    const t = audio.currentTime + delay;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(audio.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  const sfx = {
    catch: () => { tone(660, 0.12, 'triangle'); tone(990, 0.15, 'triangle', 0.12, 0, 0.08); },
    boing: () => tone(200, 0.35, 'square', 0.08, 500),
    giggle: () => { for (let i = 0; i < 4; i++) tone(900 + i * 80, 0.07, 'sine', 0.07, 0, i * 0.08); },
    plop: () => tone(300, 0.1, 'sine', 0.08, -150),
    pop: () => tone(420, 0.08, 'sine', 0.08, 300),
    flip: () => tone(700, 0.06, 'triangle', 0.1, 200),
    nope: () => { tone(300, 0.16, 'sine', 0.12, -60); tone(240, 0.22, 'sine', 0.1, -50, 0.15); },
    oops: () => { tone(500, 0.12, 'triangle', 0.1, -200); tone(350, 0.18, 'triangle', 0.1, -150, 0.12); },
    click: () => tone(520, 0.08, 'triangle', 0.12),
    count: n => tone(380 + n * 55, 0.14, 'triangle', 0.12),
    fanfare: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.3, 'triangle', 0.14, 0, i * 0.15)),
    yay: () => [659, 784, 1047].forEach((f, i) => tone(f, 0.18, 'triangle', 0.13, 0, i * 0.1)),
  };
  // Reads short instructions aloud so pre-readers can play.
  // queue = true waits for anything already being said instead of cutting it off.
  function say(words, queue = false) {
    if (muted || !window.speechSynthesis) return;
    try {
      if (!queue) window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(words);
      u.rate = 0.95; u.pitch = 1.2;
      window.speechSynthesis.speak(u);
    } catch (e) { /* voice not available */ }
  }

  // =====================================================================
  //  Drawing helpers
  // =====================================================================
  let time = 0;
  const LEMMING_COLORS = ['#f2c27b', '#e8a35c', '#f5e6c8', '#d98b4a', '#fff1d6'];

  function ellipse(x, y, rx, ry, color, rot = 0) {
    ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
  }
  function circle(x, y, r, color) { ellipse(x, y, r, r, color); }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function text(str, x, y, size, color = '#fff', stroke = '#5a3311', align = 'center') {
    ctx.font = `bold ${size}px "Comic Sans MS", "Chalkboard SE", "Comic Neue", sans-serif`;
    ctx.textAlign = align; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.lineWidth = size / 5; ctx.strokeStyle = stroke;
    ctx.strokeText(str, x, y); ctx.fillStyle = color; ctx.fillText(str, x, y);
  }
  function drawStar(x, y, r, color) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = i / 10 * Math.PI * 2 - Math.PI / 2, rr = i % 2 ? r / 2.2 : r;
      ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fillStyle = color; ctx.fill();
  }
  function drawHeart(x, y, s, color) {
    ctx.beginPath(); ctx.fillStyle = color;
    ctx.moveTo(x, y + s * 0.6);
    ctx.bezierCurveTo(x - s * 1.2, y - s * 0.2, x - s * 0.5, y - s * 1.1, x, y - s * 0.4);
    ctx.bezierCurveTo(x + s * 0.5, y - s * 1.1, x + s * 1.2, y - s * 0.2, x, y + s * 0.6);
    ctx.fill();
  }

  const clouds = [];
  for (let i = 0; i < 5; i++) clouds.push({ x: rand(0, W), y: rand(30, 120), s: rand(0.6, 1.2), v: rand(8, 20) });

  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
    sky.addColorStop(0, '#7ec8f2'); sky.addColorStop(1, '#d9f1ff');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

    circle(840, 80, 46, '#ffe066');
    ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    for (let i = 0; i < 10; i++) {
      const a = i / 10 * Math.PI * 2 + time * 0.3;
      ctx.beginPath(); ctx.moveTo(840 + Math.cos(a) * 58, 80 + Math.sin(a) * 58);
      ctx.lineTo(840 + Math.cos(a) * 74, 80 + Math.sin(a) * 74); ctx.stroke();
    }
    for (const c of clouds) {
      ctx.save(); ctx.translate(c.x, c.y); ctx.scale(c.s, c.s);
      circle(0, 0, 26, '#fff'); circle(28, -10, 32, '#fff'); circle(58, 0, 24, '#fff'); ctx.fillRect(0, 0, 58, 24);
      ctx.restore();
    }

    ctx.fillStyle = '#a8c7a0';
    ctx.beginPath(); ctx.moveTo(0, 360);
    for (let x = 0; x <= W; x += 40) ctx.lineTo(x, 330 - Math.sin(x / 120) * 40 - Math.cos(x / 53) * 15);
    ctx.lineTo(W, GROUND); ctx.lineTo(0, GROUND); ctx.fill();

    for (let i = 0; i < 12; i++) {
      const x = i * 85 + 20, h = 120 + (i * 37 % 50);
      ctx.fillStyle = '#5b3a1e'; ctx.fillRect(x - 6, GROUND - 40, 12, 40);
      ctx.fillStyle = i % 2 ? '#2f7d46' : '#3a8f52';
      for (let k = 0; k < 3; k++) {
        ctx.beginPath();
        ctx.moveTo(x, GROUND - h + k * 30);
        ctx.lineTo(x - 40 + k * 4, GROUND - 40 - (2 - k) * 25);
        ctx.lineTo(x + 40 - k * 4, GROUND - 40 - (2 - k) * 25);
        ctx.fill();
      }
    }

    for (let i = 0; i < 14; i++) circle(i * 75, 60 + Math.sin(i * 1.7) * 18, 70, i % 2 ? '#3f9b55' : '#4caf63');
    for (let i = 0; i < 14; i++) circle(i * 75 + 35, 100 + Math.cos(i) * 10, 40, '#56bb6d');
    for (let i = 0; i < 20; i++) circle((i * 53) % W + 10, 70 + (i * 29 % 60), 5, '#e84a5f');

    ctx.fillStyle = '#6cc25f'; ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = '#5aae4f'; ctx.fillRect(0, GROUND, W, 8);
    drawFlowers(GROUND + 25, 40);
  }
  function drawFlowers(top, spread) {
    for (let i = 0; i < 18; i++) {
      const fx = (i * 113) % W + 15, fy = top + (i * 17 % spread);
      const col = ['#ff8fab', '#ffd93d', '#ffffff', '#c77dff'][i % 4];
      for (let p = 0; p < 5; p++) {
        const a = p / 5 * Math.PI * 2;
        circle(fx + Math.cos(a) * 6, fy + Math.sin(a) * 6, 5, col);
      }
      circle(fx, fy, 4, '#f4a261');
    }
  }

  // Grizzly. o = { facing, walk, moving, happy, dance }
  function drawBear(x, groundY, scale = 1, o = {}) {
    const facing = o.facing || 1, walk = o.walk || 0, moving = !!o.moving, dance = !!o.dance;
    ctx.save();
    ctx.translate(x, groundY);
    ctx.scale(scale, scale);
    const step = Math.sin(dance ? time * 10 : walk);
    const bob = (moving || dance) ? Math.abs(step) * 6 : 0;
    const f = dance ? (Math.sin(time * 4) > 0 ? 1 : -1) : facing;
    const happy = o.happy || dance;

    ellipse(0, 4, 60, 10, 'rgba(0,0,0,.18)');
    ellipse(-25, -14 - (moving ? Math.max(0, step) * 8 : 0), 20, 16, '#7a4a24');
    ellipse(25, -14 - (moving ? Math.max(0, -step) * 8 : 0), 20, 16, '#7a4a24');
    ctx.translate(0, -bob);
    ellipse(0, -60, 54, 56, '#8b5a2b');
    ellipse(0, -52, 34, 38, '#d9a066');
    const armUp = happy ? -0.6 : 0;
    const armWave = dance ? Math.sin(time * 8) * 0.5 : 0;
    ctx.save(); ctx.translate(-48, -85); ctx.rotate(-2.4 + armUp + armWave); ellipse(0, 22, 15, 30, '#7a4a24'); ctx.restore();
    ctx.save(); ctx.translate(48, -85); ctx.rotate(2.4 - armUp - armWave); ellipse(0, 22, 15, 30, '#7a4a24'); ctx.restore();
    const hx = f * 4;
    circle(hx - 32, -162, 17, '#7a4a24'); circle(hx + 32, -162, 17, '#7a4a24');
    circle(hx - 32, -162, 9, '#d9a066'); circle(hx + 32, -162, 9, '#d9a066');
    circle(hx, -128, 46, '#8b5a2b');
    ellipse(hx + f * 6, -112, 24, 17, '#e3b37c');
    ellipse(hx + f * 6, -120, 9, 6, '#2b1a0e');
    if (happy) {
      ctx.strokeStyle = '#2b1a0e'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(hx - 16 + f * 4, -138, 7, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
      ctx.beginPath(); ctx.arc(hx + 16 + f * 4, -138, 7, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    } else {
      circle(hx - 16 + f * 4, -140, 7, '#2b1a0e'); circle(hx + 16 + f * 4, -140, 7, '#2b1a0e');
      circle(hx - 14 + f * 4, -142, 2.5, '#fff'); circle(hx + 18 + f * 4, -142, 2.5, '#fff');
    }
    circle(hx - 30, -118, 7, 'rgba(255,120,120,.45)'); circle(hx + 30, -118, 7, 'rgba(255,120,120,.45)');
    ctx.strokeStyle = '#2b1a0e'; ctx.lineWidth = 3;
    ctx.beginPath();
    if (happy) { ctx.arc(hx + f * 6, -108, 9, 0.1 * Math.PI, 0.9 * Math.PI); ctx.fillStyle = '#c0392b'; ctx.fill(); }
    else ctx.arc(hx + f * 6, -108, 7, 0.2 * Math.PI, 0.8 * Math.PI);
    ctx.stroke();
    ctx.restore();
  }

  // A lemming standing on (m.x, m.y). m.face: 'happy' | 'dizzy' | undefined
  function drawLemming(m) {
    ctx.save();
    ctx.translate(m.x, m.y - (m.hop || 0));
    if (m.rot) { ctx.translate(0, -16); ctx.rotate(m.rot); ctx.translate(0, 16); }
    ctx.scale(m.dir || 1, 1);
    const color = m.color || LEMMING_COLORS[0];
    const s = Math.sin(m.step || 0);
    ellipse(-7 + s * 4, -3, 6, 4, '#e07a5f');
    ellipse(7 - s * 4, -3, 6, 4, '#e07a5f');
    circle(-19, -12, 5, color);
    ellipse(0, -18, 20, 17, color);
    ellipse(4, -13, 12, 10, '#fffaf0');
    circle(-6, -34, 6, color); circle(8, -34, 6, color);
    circle(-6, -34, 3, '#ffb3c1'); circle(8, -34, 3, '#ffb3c1');
    const face = m.mode === 'fly' ? 'dizzy' : m.face;
    if (face === 'dizzy') {
      ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
      for (const ex of [3, 13]) {
        ctx.beginPath(); ctx.moveTo(ex - 3, -26); ctx.lineTo(ex + 3, -20); ctx.moveTo(ex + 3, -26); ctx.lineTo(ex - 3, -20); ctx.stroke();
      }
    } else if (face === 'happy') {
      ctx.strokeStyle = '#222'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
      for (const ex of [5, 15]) { ctx.beginPath(); ctx.arc(ex, -21, 4, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
      circle(0, -16, 3, 'rgba(255,120,150,.5)'); circle(19, -14, 2.5, 'rgba(255,120,150,.5)');
    } else {
      circle(4, -23, 6, '#fff'); circle(14, -23, 6, '#fff');
      circle(6, -23, 3.5, '#222'); circle(16, -23, 3.5, '#222');
      circle(7, -24.5, 1.2, '#fff'); circle(17, -24.5, 1.2, '#fff');
    }
    circle(20, -17, 3, '#ff7aa2');
    ctx.fillStyle = '#fff'; ctx.fillRect(14, -14, 4, 5);
    ctx.strokeStyle = '#222'; ctx.lineWidth = 1; ctx.strokeRect(14, -14, 4, 5);
    if (m.carry) {
      ctx.strokeStyle = color; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-6, -26); ctx.lineTo(-8, -40); ctx.moveTo(10, -26); ctx.lineTo(10, -40); ctx.stroke();
    }
    ctx.restore();
  }
  function drawLemmingAt(x, y, scale, m = {}) {
    ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
    drawLemming(Object.assign({ x: 0, y: 0, dir: 1 }, m));
    ctx.restore();
  }

  function drawTreat(type, x, y, rot = 0, s = 1) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
    if (type === 'honey') {
      ellipse(0, 2, 16, 15, '#f4a300');
      ctx.fillStyle = '#c97c00'; ctx.fillRect(-12, -16, 24, 7);
      ellipse(0, -16, 13, 4, '#e8e0c8');
      ctx.fillStyle = '#ffd34d'; ctx.beginPath(); ctx.moveTo(-10, -9); ctx.quadraticCurveTo(-12, 6, -6, 4); ctx.quadraticCurveTo(-4, -2, 0, -9); ctx.fill();
      ellipse(6, -1, 4, 6, 'rgba(255,255,255,.5)');
    } else if (type === 'berries') {
      circle(-7, 4, 8, '#4d5bd6'); circle(7, 4, 8, '#3f4bc0'); circle(0, -6, 8, '#5865e0');
      circle(-2, -8, 2.5, 'rgba(255,255,255,.6)');
      ctx.fillStyle = '#3a8f52'; ctx.beginPath(); ctx.ellipse(6, -15, 8, 4, -0.5, 0, Math.PI * 2); ctx.fill();
    } else if (type === 'apple') {
      circle(-5, 2, 13, '#e63946'); circle(5, 2, 13, '#e63946');
      ctx.fillStyle = '#5b3a1e'; ctx.fillRect(-1, -16, 3, 8);
      ctx.fillStyle = '#3a8f52'; ctx.beginPath(); ctx.ellipse(7, -13, 7, 3.5, -0.4, 0, Math.PI * 2); ctx.fill();
      ellipse(-6, -3, 3, 5, 'rgba(255,255,255,.5)');
    } else if (type === 'fish') {
      ellipse(0, 0, 18, 10, '#5ec4e8');
      ctx.fillStyle = '#5ec4e8'; ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(-26, -10); ctx.lineTo(-26, 10); ctx.fill();
      circle(9, -2, 3, '#fff'); circle(10, -2, 1.6, '#222');
      ellipse(0, 3, 10, 3, 'rgba(255,255,255,.4)');
    }
    ctx.restore();
  }

  // A burrow with something peeking out. up: 0 (hidden) .. 1 (all the way up)
  function drawHole(hx, hy, up, critter) {
    ellipse(hx, hy, 78, 26, '#5b3a1e');
    ellipse(hx, hy + 2, 64, 18, '#2b1a0e');
    if (critter && up > 0) {
      ctx.save();
      ctx.beginPath(); ctx.rect(hx - 110, hy - 240, 220, 240); ctx.clip();
      critter(hx, hy + 10 + (1 - up) * 125);
      ctx.restore();
    }
    ctx.beginPath(); ctx.ellipse(hx, hy, 76, 24, 0, 0, Math.PI);
    ctx.lineWidth = 12; ctx.strokeStyle = '#8b5a2b'; ctx.stroke();
  }

  // =====================================================================
  //  Particles (stars, hearts, confetti, floating words)
  // =====================================================================
  let particles = [];
  function burst(x, y, color, n = 10, kind = 'star') {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(80, 240);
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 100, life: rand(0.6, 1.1), max: 1.1, color, kind, size: rand(6, 12) });
    }
  }
  function floatText(str, x, y, color = '#fff', size = 30) {
    particles.push({ x, y, vx: 0, vy: -70, life: 1.2, max: 1.2, color, kind: 'text', label: str, size });
  }
  function updateParticles(dt) {
    for (const p of particles) {
      if (p.kind !== 'text') p.vy += 400 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);
  }
  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.max * 1.5));
      if (p.kind === 'heart') drawHeart(p.x, p.y, p.size, '#ff5c8a');
      else if (p.kind === 'confetti') { ctx.fillStyle = p.color; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.life * 6); ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore(); }
      else if (p.kind === 'text') text(p.label, p.x, p.y, p.size, p.color, '#5a3311');
      else drawStar(p.x, p.y, p.size, p.color);
    }
    ctx.globalAlpha = 1;
  }

  // =====================================================================
  //  Buttons, HUD, overlay
  // =====================================================================
  const pointer = { x: -1, y: -1, down: false };
  const buttons = [];
  function hot(x, y, w, h) { return pointer.x > x && pointer.x < x + w && pointer.y > y && pointer.y < y + h; }
  function button(label, x, y, w, h, color, action) {
    const hover = hot(x - w / 2, y - h / 2, w, h);
    const s = (1 + Math.sin(time * 4) * 0.03) * (hover ? 1.05 : 1);
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    roundRect(-w / 2, -h / 2 + 6, w, h, h / 2); ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fill();
    roundRect(-w / 2, -h / 2, w, h, h / 2); ctx.fillStyle = color; ctx.fill();
    ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.stroke();
    text(label, 0, 0, h * 0.42, '#fff', 'rgba(60,30,0,.7)');
    ctx.restore();
    buttons.push({ x: x - w / 2, y: y - h / 2, w, h, action });
  }

  function drawMute() {
    const x = W - 40, y = 30;
    circle(x, y, 22, 'rgba(255,255,255,.85)');
    ctx.fillStyle = '#5a3311';
    ctx.beginPath(); ctx.moveTo(x - 12, y - 5); ctx.lineTo(x - 5, y - 5); ctx.lineTo(x + 3, y - 12); ctx.lineTo(x + 3, y + 12); ctx.lineTo(x - 5, y + 5); ctx.lineTo(x - 12, y + 5); ctx.fill();
    ctx.strokeStyle = '#5a3311'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    if (muted) { ctx.beginPath(); ctx.moveTo(x + 7, y - 7); ctx.lineTo(x + 15, y + 7); ctx.moveTo(x + 15, y - 7); ctx.lineTo(x + 7, y + 7); ctx.stroke(); }
    else { ctx.beginPath(); ctx.arc(x + 4, y, 9, -0.8, 0.8); ctx.stroke(); }
    buttons.push({ x: x - 26, y: y - 26, w: 52, h: 52, action: () => { muted = !muted; if (muted && window.speechSynthesis) window.speechSynthesis.cancel(); } });
  }
  function drawHome() {
    const x = 40, y = 30;
    circle(x, y, 22, 'rgba(255,255,255,.85)');
    ctx.fillStyle = '#5a3311';
    ctx.beginPath(); ctx.moveTo(x, y - 13); ctx.lineTo(x + 13, y - 1); ctx.lineTo(x - 13, y - 1); ctx.fill();
    ctx.fillRect(x - 9, y - 2, 18, 13);
    ctx.fillStyle = '#ffd93d'; ctx.fillRect(x - 3, y + 3, 6, 8);
    buttons.push({ x: x - 26, y: y - 26, w: 52, h: 52, action: () => go('menu') });
  }

  // Score panel: icon, "3 / 10", and a filling bar

  //  Scenes

  const S = {};

  function drawPreview(key, cx, top) {
    if (key === 'catch') {
      drawBear(cx, top + 185, 0.55, { happy: true });

  // ---------------------------------------------------------------------
  //  Game 1: Catch — move Grizzly to catch falling treats
  // ---------------------------------------------------------------------
  S.catch = (() => {
    const LEVELS = [
      { goal: 10, fall: 110, treatEvery: 1.6, lemmingEvery: 5.5, lemSpeed: [50, 70] },
      { goal: 15, fall: 150, treatEvery: 1.3, lemmingEvery: 3.8, lemSpeed: [60, 90] },
      { goal: 20, fall: 190, treatEvery: 1.05, lemmingEvery: 2.8, lemSpeed: [70, 110] },
    ];
    const TREATS = ['honey', 'berries', 'apple', 'honey', 'fish'];
    const bear = { x: W / 2, target: null, facing: 1, walk: 0, happy: 0, moving: false };
    let level = 0, caught = 0, bonks = 0, treats = [], lemmings = [], treatTimer = 0, lemTimer = 0, levelTime = 0;

    function startLevel(n) {
      level = n; caught = 0; treats = []; lemmings = [];
      treatTimer = 0.5; lemTimer = 3; levelTime = 0;
      bear.x = W / 2; bear.target = null;
    }
    function scoreOne(t) {
      t.dead = true; caught++; bear.happy = 0.5;
      sfx.catch(); burst(t.x, t.y, '#ffd93d', 12);
      if (caught >= LEVELS[level].goal) {
        if (level === LEVELS.length - 1) {
          celebrate('catch', 'You did it!', bonks ? `Full tummy! ${bonks} lemmings bumped` : 'Grizzly has a full tummy!');
        } else {
          sfx.fanfare(); say('Yummy!');
          burst(bear.x, GROUND - 150, '#ff5c8a', 30, 'heart');
          overlay = {
            title: 'Yummy!', sub: `Level ${level + 1} done!`,
            buttons: [{ label: 'NEXT ▶', color: '#4caf50', action: () => { overlay = null; startLevel(level + 1); } }],
          };
        }
      }
    }

    return {
      start() { bonks = 0; startLevel(0); },
      update(dt) {
        if (overlay) { bear.walk += dt * 6; return; }
        const L = LEVELS[level];
        levelTime += dt;

        let move = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
        if (move !== 0) bear.target = null;
        if (bear.target !== null && Math.abs(bear.target - bear.x) > 6) move = Math.sign(bear.target - bear.x);
        bear.moving = move !== 0;
        if (move) {
          bear.x += move * 360 * dt;
          if (bear.target !== null && Math.sign(bear.target - bear.x) !== move) bear.x = bear.target;
          bear.facing = move; bear.walk += dt * 12;
        }
        bear.x = Math.max(60, Math.min(W - 60, bear.x));
        bear.happy = Math.max(0, bear.happy - dt);

        treatTimer -= dt;
        if (treatTimer <= 0) {
          treats.push({ x: rand(80, W - 80), y: 120, vy: 0, type: pick(TREATS), rot: rand(-0.3, 0.3), spin: rand(-1.5, 1.5), grounded: false, life: 5, held: false });
          treatTimer = L.treatEvery * rand(0.8, 1.2);
        }
        lemTimer -= dt;
        if (lemTimer <= 0) {
          const fromLeft = Math.random() < 0.5;
          lemmings.push({ x: fromLeft ? -30 : W + 30, y: GROUND, dir: fromLeft ? 1 : -1, speed: rand(L.lemSpeed[0], L.lemSpeed[1]),
            color: pick(LEMMING_COLORS), mode: 'walk', carry: null, vx: 0, vy: 0, rot: 0, step: rand(0, 6), hop: 0 });
          lemTimer = L.lemmingEvery * rand(0.8, 1.2);
        }

        for (const t of treats) {
          if (t.held || overlay) continue;
          if (!t.grounded) {
            t.vy = Math.min(L.fall, t.vy + 300 * dt);
            t.y += t.vy * dt; t.rot += t.spin * dt;
            if (t.y > GROUND - 190 && t.y < GROUND - 80 && Math.abs(t.x - bear.x) < 70) { scoreOne(t); continue; }
            if (t.y >= GROUND - 14) { t.y = GROUND - 14; t.grounded = true; t.rot = 0; sfx.plop(); }
          } else {
            t.life -= dt;
            if (Math.abs(t.x - bear.x) < 45) { scoreOne(t); continue; }
            if (t.life <= 0) t.dead = true;
          }
        }

        for (const m of lemmings) {
          m.step += dt * 14;
          if (m.mode === 'walk' || m.mode === 'run') {
            m.x += m.dir * (m.mode === 'run' ? m.speed * 1.8 : m.speed) * dt;
            m.hop = Math.abs(Math.sin(m.step)) * 5;
            if (m.mode === 'walk') {
              for (const t of treats) {
                if (t.grounded && !t.held && !t.dead && Math.abs(t.x - m.x) < 18) {
                  t.held = true; m.carry = t; m.mode = 'run';
                  m.dir = m.x < W / 2 ? -1 : 1;
                  sfx.giggle();
                  break;
                }
              }
            }
            if (Math.abs(m.x - bear.x) < 55) {
              m.mode = 'fly';
              m.vx = (m.x < bear.x ? -1 : 1) * rand(150, 250);
              m.vy = -rand(420, 520);
              bonks++; sfx.boing();
              burst(m.x, m.y - 20, '#fff', 8, 'heart');
              if (m.carry) {
                const t = m.carry; t.held = false; t.grounded = false; t.y = m.y - 60; t.x = m.x; t.vy = -200; t.life = 5;
                m.carry = null;
              }
            }
            if (m.x < -60 || m.x > W + 60) { m.dead = true; if (m.carry) m.carry.dead = true; }
          } else {
            m.vy += 700 * dt; m.x += m.vx * dt; m.y += m.vy * dt; m.rot += dt * 10;
            if (m.y > H + 60 || m.x < -80 || m.x > W + 80) m.dead = true;
          }
          if (m.carry) { m.carry.x = m.x; m.carry.y = m.y - 46 - m.hop; }
        }
        treats = treats.filter(t => !t.dead);
        lemmings = lemmings.filter(m => !m.dead);
      },
      render() {
        drawBackground();
        for (const t of treats) {
          if (t.held) continue;
          if (t.grounded && t.life < 1.5 && Math.floor(time * 8) % 2) continue;
          drawTreat(t.type, t.x, t.y, t.rot);
        }
        drawBear(bear.x, GROUND, 1, { facing: bear.facing, walk: bear.walk, moving: bear.moving, happy: bear.happy > 0, dance: !!overlay });
        for (const m of lemmings) {
          drawLemming(m);
          if (m.carry) drawTreat(m.carry.type, m.carry.x, m.carry.y, 0, 0.9);
        }
        drawProgress((x, y) => drawTreat('honey', x, y), caught, LEVELS[level].goal);
        for (let i = 0; i < LEVELS.length; i++) drawStar(W / 2 + 60 + i * 40, 38, 16, i <= level ? '#ffd93d' : 'rgba(255,255,255,.6)');
        if (!overlay && levelTime < 2) {
          ctx.globalAlpha = Math.min(1, 2 - levelTime);
          text(`Level ${level + 1}`, W / 2, H / 2 - 60, 72, '#ffd93d', '#5a3311');
          ctx.globalAlpha = 1;
        }
      },
      pointer(p) { bear.target = p.x; },
      drag(p) { bear.target = p.x; },
    };
  })();

  // ---------------------------------------------------------------------
  //  Game 2: Boop! — tap lemmings that pop out of holes (not Grizzly!)
  // ---------------------------------------------------------------------
  S.boop = (() => {
    const GOAL = 15;
    const holes = [];
    for (const y of [315, 455]) for (const x of [200, 480, 760]) holes.push({ x, y });
    let count = 0, spawnT = 0, doneT = 0;

    return {
      start() {
        count = 0; spawnT = 1; doneT = 0;
        for (const h of holes) Object.assign(h, { who: null, up: 0, phase: 'up', stay: 0, booped: false, color: '#f2c27b', dir: 1 });
      },
      update(dt) {
        if (overlay) return;
        if (doneT > 0) {
          doneT -= dt;
          if (doneT <= 0) celebrate('boop', 'Boop-tastic!', 'You tickled all the lemmings!');
        } else {
          spawnT -= dt;
          const maxUp = count < 5 ? 1 : count < 10 ? 2 : 3;
          const active = holes.filter(h => h.who).length;
          if (spawnT <= 0 && active < maxUp) {
            const empty = holes.filter(h => !h.who);
            const h = pick(empty);
            h.who = count > 2 && Math.random() < 0.18 ? 'bear' : 'lem';
            h.phase = 'up'; h.up = 0; h.booped = false;
            h.stay = Math.max(1.1, 2.3 - count * 0.06);
            h.color = pick(LEMMING_COLORS); h.dir = pick([1, -1]);
            spawnT = rand(0.4, 0.9);
            sfx.pop();
          }
        }
        for (const h of holes) {
          if (!h.who) continue;
          if (h.phase === 'up') { h.up += dt * 5; if (h.up >= 1) { h.up = 1; h.phase = 'stay'; } }
          else if (h.phase === 'stay') { h.stay -= dt; if (h.stay <= 0) h.phase = 'down'; }
          else { h.up -= dt * 4; if (h.up <= 0) { h.up = 0; h.who = null; } }
        }
      },
      render() {
        drawBackground();
        // grassy meadow full of burrows
        ctx.fillStyle = '#7fcf6a';
        ctx.beginPath(); ctx.moveTo(0, 250);
        for (let x = 0; x <= W; x += 30) ctx.lineTo(x, 240 + Math.sin(x / 90) * 12);
        ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
        ctx.fillStyle = '#6cc25f'; ctx.fillRect(0, 385, W, H - 385);
        drawFlowers(260, 100);
        for (const h of holes) {
          drawHole(h.x, h.y, h.up, h.who === 'lem'
            ? (x, y) => drawLemmingAt(x, y, 2.2, { color: h.color, dir: h.dir, face: h.booped ? 'happy' : undefined })
            : h.who === 'bear'
              ? (x, y) => drawBear(x, y, 0.62, { happy: true, dance: h.booped })
              : null);
        }
        drawProgress((x, y) => drawLemmingAt(x, y + 14, 0.9, { color: '#e8a35c', face: 'happy' }), count, GOAL);
      },
      pointer(p) {
        if (doneT > 0) return;
        for (const h of holes) {
          if (!h.who || h.booped || h.up < 0.4) continue;
          if (Math.hypot(p.x - h.x, p.y - (h.y - 50 * h.up)) < 72) {
            h.booped = true; h.phase = 'stay'; h.stay = 0.5;
            if (h.who === 'lem') {
              count++;
              sfx.giggle();
              burst(h.x, h.y - 70, '#ff5c8a', 8, 'heart');
              floatText('+1', h.x + 40, h.y - 100, '#ffd93d');
              if (count >= GOAL) doneT = 0.8;
            } else {
              sfx.oops();
              floatText("That's Grizzly!", h.x, h.y - 140, '#fff', 28);
            }
            return;
          }
        }
      },
    };
  })();

  // ---------------------------------------------------------------------
  //  Game 3: Match — memory pairs
  // ---------------------------------------------------------------------
  S.match = (() => {
    const FACES = ['bear', 'lemming', 'honey', 'berries', 'apple', 'fish'];
    const CW = 150, CH = 130, GAP = 18, X0 = (W - (4 * CW + 3 * GAP)) / 2, Y0 = 84;
    let cards = [], open = [], lockT = 0, pairs = 0, doneT = 0;

    function drawFace(f, x, y) {
      if (f === 'bear') drawBear(x, y + 44, 0.45, { happy: true });
      else if (f === 'lemming') drawLemmingAt(x, y + 38, 2, { color: '#e8a35c' });
      else drawTreat(f, x, y + 4, 0, 2.2);
    }
    return {
      start() {
        const deck = shuffle([...FACES, ...FACES]);
        cards = deck.map((f, i) => ({
          f, x: X0 + (i % 4) * (CW + GAP) + CW / 2, y: Y0 + Math.floor(i / 4) * (CH + GAP) + CH / 2,
          flip: 0, target: 0, matched: false, shake: 0,
        }));
        open = []; lockT = 0; pairs = 0; doneT = 0;
      },
      update(dt) {
        for (const c of cards) {
          c.flip += Math.sign(c.target - c.flip) * Math.min(Math.abs(c.target - c.flip), dt * 5);
          c.shake = Math.max(0, c.shake - dt);
        }
        if (overlay) return;
        if (lockT > 0) { lockT -= dt; if (lockT <= 0) { open.forEach(c => { c.target = 0; }); open = []; sfx.flip(); } }
        if (doneT > 0) { doneT -= dt; if (doneT <= 0) celebrate('match', 'Super memory!', 'You found all the pairs!'); }
      },
      render() {
        drawBackground();
        for (const c of cards) {
          const sx = Math.max(0.03, Math.abs(Math.cos(c.flip * Math.PI)));
          const front = c.flip > 0.5;
          ctx.save();
          ctx.translate(c.x + (c.shake ? Math.sin(c.shake * 40) * 5 : 0), c.y + (c.matched ? Math.sin(time * 3 + c.x) * 3 : 0));
          ctx.scale(sx, 1);
          roundRect(-CW / 2, -CH / 2 + 6, CW, CH, 16); ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fill();
          roundRect(-CW / 2, -CH / 2, CW, CH, 16);
          if (front) {
            ctx.fillStyle = '#fff8e7'; ctx.fill();
            ctx.lineWidth = 6; ctx.strokeStyle = c.matched ? '#ffd93d' : '#fff'; ctx.stroke();
            drawFace(c.f, 0, 0);
          } else {
            ctx.fillStyle = '#3a8f52'; ctx.fill();
            ctx.lineWidth = 6; ctx.strokeStyle = '#fff'; ctx.stroke();
            // paw print
            ellipse(0, 12, 22, 18, '#56bb6d');
            [[-24, -12], [-9, -26], [9, -26], [24, -12]].forEach(([px, py]) => circle(px, py, 9, '#56bb6d'));
          }
          ctx.restore();
        }
        drawProgress((x, y) => drawStar(x, y, 16, '#ffd93d'), pairs, FACES.length);
      },
      pointer(p) {
        if (lockT > 0 || doneT > 0) return;
        const c = cards.find(k => Math.abs(p.x - k.x) < CW / 2 && Math.abs(p.y - k.y) < CH / 2);
        if (!c || c.matched || c.target === 1) return;
        c.target = 1; sfx.flip(); open.push(c);
        if (open.length === 2) {
          const [a, b] = open;
          if (a.f === b.f) {
            a.matched = b.matched = true; open = []; pairs++;
            setTimeout(() => { sfx.catch(); burst(a.x, a.y, '#ffd93d', 10); burst(b.x, b.y, '#ffd93d', 10); }, 200);
            if (pairs === FACES.length) doneT = 1.2;
          } else {
            lockT = 1.1;
            setTimeout(() => { a.shake = b.shake = 0.3; sfx.nope(); }, 250);
          }
        }
      },
    };
  })();

  // ---------------------------------------------------------------------
  //  Shared pieces for the number games (Count, Add, Take Away)
  // ---------------------------------------------------------------------
  // Three answer choices: the right one plus two nearby numbers in [min, max].
  function pickChoices(answer, min, max) {
    const set = new Set([answer]);
    while (set.size < 3) { const n = answer + pick([-2, -1, 1, 2]); if (n >= min && n <= max) set.add(n); }
    return shuffle([...set]);
  }
  // Big round number buttons. q = { choices, xs, y, r, wrong, answer, solved, color }
  function drawChoices(q) {
    q.choices.forEach((n, i) => {
      const x = q.xs[i], isWrong = q.wrong.has(n), isRight = q.solved && n === q.answer;
      const s = isRight ? 1.15 + Math.sin(time * 8) * 0.05 : hot(x - q.r, q.y - q.r, q.r * 2, q.r * 2) && !isWrong ? 1.07 : 1;
      ctx.save(); ctx.translate(x, q.y); ctx.scale(s, s);
      ctx.globalAlpha = isWrong || (q.solved && !isRight) ? 0.35 : 1;
      circle(0, 6, q.r, 'rgba(0,0,0,.25)');
      circle(0, 0, q.r, isRight ? '#4caf50' : q.color);
      ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, q.r, 0, Math.PI * 2); ctx.stroke();
      text(String(n), 0, 3, q.r * 1.1, '#fff', 'rgba(40,0,80,.6)');
      ctx.restore();
    });
    ctx.globalAlpha = 1;
  }
  // Index of the choice button under p, or -1.
  function hitChoice(p, xs, y, r) {
    return xs.findIndex(x => Math.hypot(p.x - x, p.y - y) < r + 8);
  }
  // White bubble with a number, shown over things the child has tapped to count.
  function drawCountBadge(x, y, n, color) {
    circle(x, y, 18, '#fff');
    text(String(n), x, y + 1, 26, color, '#fff');
  }
  function drawRoundStars(done, total) {
    for (let i = 0; i < total; i++) drawStar(W / 2 - (total - 1) * 20 + i * 40, 38, 16, i < done ? '#ffd93d' : 'rgba(255,255,255,.7)');
  }

  // ---------------------------------------------------------------------
  //  Game 4: Count — how many lemmings came to visit?
  // ---------------------------------------------------------------------
  S.count = (() => {
    const RANGES = [[2, 3], [3, 4], [4, 6], [5, 7], [6, 9]];
    const CHOICE_X = [430, 590, 750], CHOICE_Y = 195, CHOICE_R = 55;
    let round = 0, target = 0, lems = [], phase = 'walk', choices = [], wrong = new Set(), tapN = 0, timer = 0;

    function newRound() {
      const [a, b] = RANGES[round];
      target = randInt(a, b);
      const span = Math.min(80 * (target - 1), 620);
      const startX = 560 - span / 2;
      lems = [];
      for (let i = 0; i < target; i++) {
        lems.push({ x: -60 - i * 80, tx: target === 1 ? 560 : startX + i * span / (target - 1), color: pick(LEMMING_COLORS),
          step: rand(0, 6), hop: 0, jy: 0, jv: 0, num: 0 });
      }
      choices = pickChoices(target, 1, 10);
      wrong = new Set(); tapN = 0; phase = 'walk';
    }
    function jump(l) { if (l.jy === 0) l.jv = -320; }

    return {
      start() { round = 0; newRound(); },
      update(dt) {
        for (const l of lems) {
          l.step += dt * 14;
          if (l.x < l.tx) { l.x = Math.min(l.tx, l.x + 330 * dt); l.hop = Math.abs(Math.sin(l.step)) * 5; } else l.hop = 0;
          if (l.jy < 0 || l.jv < 0) { l.jv += 1300 * dt; l.jy += l.jv * dt; if (l.jy > 0) { l.jy = 0; l.jv = 0; } }
        }
        if (overlay) return;
        if (phase === 'walk' && lems.every(l => l.x >= l.tx)) { phase = 'ask'; say('How many lemmings?'); }
        if (phase === 'right') {
          if (Math.random() < 0.15) jump(pick(lems));
          timer -= dt;
          if (timer <= 0) {
            round++;
            if (round >= RANGES.length) { phase = 'done'; celebrate('count', 'Super counting!', 'You counted every lemming!'); }
            else newRound();
          }
        }
      },
      render() {
        drawBackground();
        const cheering = phase === 'right' || phase === 'done';
        drawBear(95, GROUND, 0.85, { happy: cheering, dance: cheering });

        if (phase !== 'walk') {
          // speech bubble
          const msg = cheering ? `Yes! ${target}!` : 'How many?';
          roundRect(150, 205, 190, 62, 26); ctx.fillStyle = '#fff'; ctx.fill();
          ctx.beginPath(); ctx.moveTo(165, 255); ctx.lineTo(135, 290); ctx.lineTo(190, 262); ctx.fill();
          text(msg, 245, 236, 28, '#9b5de5', '#fff');

          drawChoices({ choices, xs: CHOICE_X, y: CHOICE_Y, r: CHOICE_R, wrong, answer: target, solved: cheering, color: '#9b5de5' });
        }

        for (const l of lems) {
          drawLemmingAt(l.x, GROUND - l.hop + l.jy, 1.6, { color: l.color, step: l.step, face: cheering ? 'happy' : undefined });
          if (l.num) drawCountBadge(l.x, GROUND - 92 + l.jy, l.num, '#9b5de5');
        }
        drawRoundStars(round, RANGES.length);
      },
      pointer(p) {
        if (phase === 'ask') {
          const i = hitChoice(p, CHOICE_X, CHOICE_Y, CHOICE_R);
          if (i >= 0) {
            const n = choices[i];
            if (wrong.has(n)) return;
            if (n === target) {
              phase = 'right'; timer = 2.2;
              sfx.yay(); say(`Yes! ${target} lemmings!`);
              lems.forEach(jump);
              burst(CHOICE_X[i], CHOICE_Y, '#ffd93d', 16);
            } else {
              wrong.add(n); sfx.nope(); say('Try again!');
            }
            return;
          }
        }
        if (phase === 'done') return;
        for (const l of lems) {
          if (Math.abs(p.x - l.x) < 40 && p.y > GROUND - 110 && p.y < GROUND + 15) {
            if (!l.num) { tapN++; l.num = tapN; sfx.count(tapN); say(String(tapN)); }
            jump(l);
            return;
          }
        }
      },
    };
  })();

  // ---------------------------------------------------------------------
  //  Games 5 & 6: Add and Take Away — single-digit sums shown with pictures
  // ---------------------------------------------------------------------
  //  Add:       two groups of lemmings walk in, "3 + 2 = ?", groups join on a right answer.
  //  Take Away: Grizzly's honey pots appear, lemmings run off with some, "5 − 2 = ?".
  function makeMathGame(mode) {
    const ADD = mode === 'add';
    const ROUNDS = 5;
    const ADD_MAX_SUM = [5, 6, 8, 10, 10];                      // answers never go above 10
    const SUB_START = [[3, 5], [4, 6], [5, 7], [6, 9], [7, 9]]; // how many pots to start with
    const CHOICE_X = [400, 560, 720], CHOICE_Y = 252, CHOICE_R = 50;
    const COLOR = ADD ? '#4caf50' : '#ff8c42', INK = ADD ? '#2e7d32' : '#b85a12';
    const SPACING = ADD ? 64 : 72, PLUS_GAP = 96, CENTER = 560;
    let round = 0, a = 0, b = 0, answer = 0, phase = 'intro', timer = 0, tapN = 0, plusX = 0, plusAlpha = 1;
    let items = [], thieves = [], choices = [], wrong = new Set();

    function jump(it) { if (it.jy === 0) it.jv = -320; }

    function newRound() {
      if (ADD) {
        const sum = randInt(2, ADD_MAX_SUM[round]);
        a = randInt(1, sum - 1); b = sum - a; answer = sum;
      } else {
        const [lo, hi] = SUB_START[round];
        a = randInt(lo, hi); b = randInt(1, Math.min(a - 1, 4)); answer = a - b;
      }
      items = []; thieves = []; tapN = 0; wrong = new Set(); plusAlpha = 1;
      choices = pickChoices(answer, 0, 10);
      phase = 'intro';
      const base = { jy: 0, jv: 0, num: 0, hop: 0 };
      if (ADD) {
        const width = (a - 1) * SPACING + PLUS_GAP + (b - 1) * SPACING;
        const x0 = CENTER - width / 2;
        plusX = x0 + (a - 1) * SPACING + PLUS_GAP / 2;
        for (let i = 0; i < a; i++) {
          const tx = x0 + i * SPACING;
          items.push(Object.assign({ group: 0, tx, x: tx - 700, color: '#e8a35c', dir: 1, step: rand(0, 6) }, base));
        }
        for (let j = 0; j < b; j++) {
          const tx = plusX + PLUS_GAP / 2 + j * SPACING;
          items.push(Object.assign({ group: 1, tx, x: tx + 700, color: '#f5e6c8', dir: -1, step: rand(0, 6) }, base));
        }
      } else {
        const x0 = CENTER - (a - 1) * SPACING / 2;
        for (let i = 0; i < a; i++) items.push(Object.assign({ x: x0 + i * SPACING, pop: -i * 0.12, gone: false }, base));
        timer = 1.6 + a * 0.12;
        say(`Grizzly has ${a} honey pots.`, true);
      }
    }

    return {
      start() { round = 0; newRound(); },
      update(dt) {
        for (const it of items) {
          if (ADD) {
            it.step += dt * 14;
            const d = it.tx - it.x;
            if (Math.abs(d) > 1) { it.x += Math.sign(d) * Math.min(Math.abs(d), 380 * dt); it.hop = Math.abs(Math.sin(it.step)) * 5; }
            else { it.x = it.tx; it.hop = 0; }
          } else {
            it.pop = Math.min(1, it.pop + dt * 3);
          }
          if (it.jy < 0 || it.jv < 0) { it.jv += 1300 * dt; it.jy += it.jv * dt; if (it.jy > 0) { it.jy = 0; it.jv = 0; } }
        }
        for (const t of thieves) {
          t.step += dt * 14;
          if (t.state === 'in') {
            t.x -= 300 * dt;
            if (t.x <= t.target.x) { t.x = t.target.x; t.target.gone = true; t.state = 'out'; sfx.giggle(); }
          } else {
            t.x += 360 * dt;
            if (t.x > W + 60) t.dead = true;
          }
        }
        thieves = thieves.filter(t => !t.dead);
        if (overlay) return;

        if (phase === 'intro') {
          if (ADD && items.every(it => it.x === it.tx)) {
            phase = 'ask';
            say(`${a} plus ${b}. How many in all?`, true);
          } else if (!ADD) {
            timer -= dt;
            if (timer <= 0) {
              for (let k = 0; k < b; k++) thieves.push({ x: W + 40 + k * 90, target: items[a - 1 - k], state: 'in', step: rand(0, 6) });
              phase = 'steal';
              say(b === 1 ? 'Oh no! A lemming takes 1 away!' : `Oh no! Lemmings take ${b} away!`, true);
            }
          }
        } else if (phase === 'steal' && thieves.length === 0) {
          phase = 'ask';
          say('How many are left?', true);
        } else if (phase === 'right') {
          plusAlpha = Math.max(0, plusAlpha - dt * 2);
          const standing = items.filter(it => !it.gone);
          if (Math.random() < 0.12 && standing.length) jump(pick(standing));
          timer -= dt;
          if (timer <= 0) {
            round++;
            if (round >= ROUNDS) {
              phase = 'done';
              if (ADD) celebrate('add', 'Adding star!', 'You can add!');
              else celebrate('sub', 'Take-away hero!', 'You can take away!');
            } else newRound();
          }
        }
      },
      render() {
        drawBackground();
        const solved = phase === 'right' || phase === 'done';
        drawBear(85, GROUND, 0.75, { happy: solved, dance: solved });

        // the number sentence
        roundRect(CENTER - 180, 68, 360, 78, 32); ctx.fillStyle = 'rgba(255,255,255,.94)'; ctx.fill();
        ctx.lineWidth = 6; ctx.strokeStyle = solved ? '#4caf50' : COLOR; ctx.stroke();
        text(`${a} ${ADD ? '+' : '−'} ${b} = ${solved ? answer : '?'}`, CENTER, 108, 56, INK, '#fff');

        if (phase === 'ask' || solved) {
          drawChoices({ choices, xs: CHOICE_X, y: CHOICE_Y, r: CHOICE_R, wrong, answer, solved, color: COLOR });
        }

        if (ADD) {
          ctx.globalAlpha = plusAlpha;
          text('+', plusX, GROUND - 32, 60, '#fff', INK);
          ctx.globalAlpha = 1;
          for (const it of items) {
            drawLemmingAt(it.x, GROUND - it.hop + it.jy, 1.3, { color: it.color, dir: it.dir, step: it.hop ? it.step : 0, face: solved ? 'happy' : undefined });
            if (it.num) drawCountBadge(it.x, GROUND - 80 + it.jy, it.num, INK);
          }
        } else {
          for (const it of items) {
            if (it.gone) {
              // faded outline where a pot was taken
              ctx.globalAlpha = 0.25; drawTreat('honey', it.x, GROUND - 26, 0, 1.7); ctx.globalAlpha = 1;
              continue;
            }
            if (it.pop <= 0) continue;
            drawTreat('honey', it.x, GROUND - 26 + it.jy, 0, 1.7 * Math.sin(it.pop * Math.PI / 2));
            if (it.num) drawCountBadge(it.x, GROUND - 88 + it.jy, it.num, INK);
          }
          for (const t of thieves) {
            const out = t.state === 'out';
            drawLemmingAt(t.x, GROUND - Math.abs(Math.sin(t.step)) * 4, 1.3, { color: '#d98b4a', dir: out ? 1 : -1, step: t.step, carry: out, face: out ? 'happy' : undefined });
            if (out) drawTreat('honey', t.x, GROUND - 68, 0, 1.2);
          }
        }
        drawRoundStars(round, ROUNDS);
      },
      pointer(p) {
        if (phase !== 'ask') return;
        const i = hitChoice(p, CHOICE_X, CHOICE_Y, CHOICE_R);
        if (i >= 0) {
          const n = choices[i];
          if (wrong.has(n)) return;
          if (n === answer) {
            phase = 'right'; timer = 2.8;
            sfx.yay();
            say(ADD ? `${a} plus ${b} is ${answer}!` : `${a} take away ${b} is ${answer}!`);
            burst(CHOICE_X[i], CHOICE_Y, '#ffd93d', 16);
            if (ADD) items.forEach(it => { if (it.group === 1) it.tx -= PLUS_GAP - SPACING; });
            items.forEach(it => { if (!it.gone) jump(it); });
          } else {
            wrong.add(n); sfx.nope(); say('Try again!');
          }
          return;
        }
        // tap things to count them
        for (const it of items) {
          if (it.gone) continue;
          if (Math.abs(p.x - it.x) < 34 && p.y > GROUND - 100 && p.y < GROUND + 15) {
            if (!it.num) { tapN++; it.num = tapN; sfx.count(tapN); say(String(tapN)); }
            jump(it);
            return;
          }
        }
      },
    };
  }
  S.add = makeMathGame('add');
  S.sub = makeMathGame('sub');

  // =====================================================================
  //  Input
  // =====================================================================
  function toGame(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }
  function hitButton(p) {
    for (let i = buttons.length - 1; i >= 0; i--) {
      const b = buttons[i];
      if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) return b;
    }
    return null;
  }

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    initAudio();
    const p = toGame(e); pointer.x = p.x; pointer.y = p.y; pointer.down = true;
    const b = hitButton(p);
    if (b) { sfx.click(); b.action(); return; }
    if (!overlay && scene.pointer) scene.pointer(p);
  });
  window.addEventListener('pointermove', e => {
    const p = toGame(e); pointer.x = p.x; pointer.y = p.y;
    if (pointer.down && !overlay && scene.drag) scene.drag(p);
  });
  window.addEventListener('pointerup', () => { pointer.down = false; });
  window.addEventListener('pointercancel', () => { pointer.down = false; });

  window.addEventListener('keydown', e => {
    initAudio();
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keys.left = true; e.preventDefault(); }
    if (k === 'ArrowRight' || k === 'd' || k === 'D') { keys.right = true; e.preventDefault(); }
    if ((k === 'Enter' || k === ' ') && overlay) { e.preventDefault(); sfx.click(); overlay.buttons[0].action(); }
    if (k === 'Escape' && scene !== S.menu) go('menu');
    if (k === 'm' || k === 'M') muted = !muted;
  });
  window.addEventListener('keyup', e => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
    if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  });
  window.addEventListener('blur', () => { keys.left = keys.right = false; pointer.down = false; });

  // =====================================================================
  //  Main loop
  // =====================================================================
  function update(dt) {
    time += dt;
    for (const c of clouds) { c.x += c.v * dt; if (c.x > W + 120) c.x = -120; }
    updateParticles(dt);
    if (overlay && overlay.win && Math.random() < 0.4) {
      particles.push({ x: rand(0, W), y: -10, vx: rand(-40, 40), vy: rand(50, 150), life: 3, max: 3,
        color: pick(['#ff5c8a', '#ffd93d', '#6bcb77', '#4d96ff', '#c77dff']), kind: 'confetti', size: rand(6, 11) });
    }
    scene.update(dt);
  }
  function render() {
    buttons.length = 0;
    ctx.clearRect(0, 0, W, H);
    scene.render();
    if (overlay) drawOverlay();
    drawParticles();
    if (scene !== S.menu) drawHome();
    drawMute();
  }

  go('menu');
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Small hook for automated testing.
  window.__game = {
    go,
    get scene() { return Object.keys(S).find(k => S[k] === scene); },
    get overlay() { return overlay && overlay.title; },
  };
})();
</script>
</body>
</html>
