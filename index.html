        const d = Math.hypot(tx - bear.x, ty - bear.y);
        bear.moving = d > 1.5;
        if (bear.moving) {
          const k = Math.min(1, (cell * 7 * dt) / d);
          bear.x += (tx - bear.x) * k; bear.y += (ty - bear.y) * k;
          bear.walk += dt * 12;
        }
        for (const l of lems) updateHop(l, dt);
        puzzledT = Math.max(0, puzzledT - dt);
        bumpT = Math.max(0, bumpT - dt);
        hintT = Math.max(0, hintT - dt);
        if (overlay) return;
        if (phase === 'win') {
          timer -= dt;
          if (timer <= 0) {
            round++;
            if (round >= SIZES.length) { phase = 'done'; celebrate('maze', 'Maze master!', 'Grizzly found all the honey!'); }
            else newRound();
          }
        }
      },
      render() {
        drawBackground();
        // the maze board: a lawn with hedges
        roundRect(ox - 16, oy - 16, cols * cell + 32, rows * cell + 32, 26);
        ctx.fillStyle = '#b5e39a'; ctx.fill(); inkLine(4); ctx.stroke();
        for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
          if ((x + y) % 2) { ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(ox + x * cell, oy + y * cell, cell, cell); }
        }
        for (const m of muds) { const [mx, my] = center(m.c); blob(mx, my + cell * 0.12, cell * 0.33, cell * 0.2, '#8a6239', 0, 2); ellipse(mx - cell * 0.08, my + cell * 0.06, cell * 0.12, cell * 0.06, 'rgba(255,255,255,.25)'); }

        // honey at the far corner
        const [hx, hy] = center([cols - 1, rows - 1]);
        if (phase === 'play') drawTreat('honey', hx, hy + Math.sin(time * 4) * 3, Math.sin(time * 2) * 0.1, cell * 0.022);

        // dotted trail of where Grizzly has been
        if (path.length > 1) {
          ctx.save();
          ctx.setLineDash([1, cell * 0.24]);
          ctx.lineCap = 'round'; ctx.lineWidth = Math.max(8, cell * 0.12); ctx.strokeStyle = '#ffb703';
          ctx.beginPath();
          path.forEach((c, i) => { const [px, py] = center(c); if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py); });
          ctx.stroke();
          ctx.restore();
        }

    const SYMBOLS = ['honey', 'apple', 'berries', 'fish'];

    function makeSolution() {
      const base = [[0, 1, 2, 3], [2, 3, 0, 1], [1, 0, 3, 2], [3, 2, 1, 0]];
      const order = () => { const out = []; shuffle([0, 1]).forEach(b => shuffle([0, 1]).forEach(k => out.push(b * 2 + k))); return out; };
      const rows = order(), cols = order(), sym = shuffle([0, 1, 2, 3]);

    function fits(g, r, c, v) {
      for (let i = 0; i < 4; i++) if (g[r][i] === v || g[i][c] === v) return false;

    if (pointer.down && swipe.on) {
      const dx = p.x - swipe.x;
      if (!swipe.moved && Math.abs(dx) > 14 && Math.abs(dx) > Math.abs(p.y - swipe.y)) swipe.moved = true;
      if (swipe.moved) menuDrag = dx;
    }
    if (pointer.down && !pressedButton && !overlay && scene.drag) scene.drag(p);
  });
  window.addEventListener('pointerup', e => {
    initAudio(true);
    const wasDown = pointer.down;
    pointer.down = false;
    if (wasDown && swipe.on && swipe.moved) {
      // a long enough swipe flips the page; a short one springs back
      swipe.on = false; pressedButton = false;
      if (Math.abs(menuDrag) > 80) flipPage(menuDrag < 0 ? 1 : -1);
      else { menuSlide = menuDrag; menuDrag = 0; }
      return;
    }
    swipe.on = false;
    if (!pressedButton) {
      // scenes that drag things (Bridge, Maze...) hear about the finger lifting
      if (wasDown && !overlay && scene.release) scene.release(toGame(e));
      return;
    }
    pressedButton = false;
    const b = hitButton(toGame(e));
    if (b) { sfx.click(); b.action(); }
  });
  window.addEventListener('pointercancel', () => {
    pointer.down = false; pressedButton = false;
    if (swipe.on) { swipe.on = false; menuSlide = menuDrag; menuDrag = 0; }
  });
  // Extra unlock points for iOS, which treats touchend and click as real gestures.
  window.addEventListener('touchend', () => initAudio(true), { passive: true });
  window.addEventListener('click', () => initAudio(true));

  window.addEventListener('keydown', e => {
    initAudio(true);
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keys.left = true; e.preventDefault(); }
    if (k === 'ArrowRight' || k === 'd' || k === 'D') { keys.right = true; e.preventDefault(); }
    if ((k === 'Enter' || k === ' ') && overlay) { e.preventDefault(); sfx.click(); overlay.buttons[0].action(); }
    if (k === 'Escape' && scene !== S.menu) go('menu');
    if (scene === S.menu && (k === 'ArrowLeft' || k === 'ArrowRight')) flipPage(k === 'ArrowLeft' ? -1 : 1);
    if (k === 'm' || k === 'M') muted = !muted;
  });
  window.addEventListener('keyup', e => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
    if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  });
  window.addEventListener('blur', () => { keys.left = keys.right = false; pointer.down = false; });

  // =====================================================================
  //  Main loop
  // =====================================================================
  function update(dt) {
    time += dt;
    for (const c of clouds) { c.x += c.v * dt; if (c.x > W + 120) c.x = -120; }
    updateParticles(dt);
    if (overlay && overlay.win && Math.random() < 0.4) {
      particles.push({ x: rand(0, W), y: -10, vx: rand(-40, 40), vy: rand(50, 150), life: 3, max: 3,
        color: pick(['#ff5c8a', '#ffd93d', '#6bcb77', '#4d96ff', '#c77dff']), kind: 'confetti', size: rand(6, 11) });
    }
    scene.update(dt);
    updateMusic();
  }
  function render() {
    buttons.length = 0;
    ctx.clearRect(0, 0, W, H);
    scene.render();
    if (overlay) drawOverlay();
    drawParticles();
    if (scene !== S.menu) drawHome();
    drawMute();
  }

  go('menu');
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Small hook for automated testing.
  window.__game = {
    go,
    get scene() { return Object.keys(S).find(k => S[k] === scene); },
    get overlay() { return overlay && overlay.title; },
    get audio() { return audio ? audio.state : 'none'; },
    get music() { return { on: musicOn, step: musicStep, level: musicLevel, song: playingKey }; },
    songs: SONGS,
    art: { ctx, drawBear, drawLemmingAt, drawTreat }, // for drawing pose sheets in tests
  };
})();
</script>
</body>
</html>
