<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Grizzly and the Lemmings</title>
<style>
  :root { color-scheme: light; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #2e6b3a;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    font-family: "Comic Sans MS", "Chalkboard SE", "Comic Neue", sans-serif;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<script>
(() => {
  'use strict';

  // =====================================================================
  //  Setup
  // =====================================================================
  const W = 960, H = 540, GROUND = 470;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  function resize() {
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = Math.floor(W * scale) + 'px';
    canvas.style.height = Math.floor(H * scale) + 'px';
    canvas.width = Math.floor(W * scale * dpr);
    canvas.height = Math.floor(H * scale * dpr);
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };

  // Saved stickers (stars) per game. Only a convenience; works without storage.
  let stars = {};
  try { stars = JSON.parse(localStorage.getItem('grizzly-stars') || '{}') || {}; } catch (e) { stars = {}; }
  function saveStars() { try { localStorage.setItem('grizzly-stars', JSON.stringify(stars)); } catch (e) { /* ignore */ } }

  // =====================================================================
  //  Sound + voice
  // =====================================================================
  let audio = null, muted = false;
  // A short silent WAV, built here so no file is needed.
  function silentWavURL() {
    const n = 800, buf = new Uint8Array(44 + n), dv = new DataView(buf.buffer);
    const put = (o, s) => { for (let i = 0; i < s.length; i++) buf[o + i] = s.charCodeAt(i); };
    put(0, 'RIFF'); dv.setUint32(4, 36 + n, true); put(8, 'WAVE'); put(12, 'fmt ');
    dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
    dv.setUint32(24, 8000, true); dv.setUint32(28, 8000, true); dv.setUint16(32, 1, true); dv.setUint16(34, 8, true);
    put(36, 'data'); dv.setUint32(40, n, true); buf.fill(128, 44);
    let bin = ''; for (const c of buf) bin += String.fromCharCode(c);
    return 'data:audio/wav;base64,' + btoa(bin);
  }
  let htmlAudioUnlocked = false, speechUnlocked = false;
  // Call from every tap/key. iPads and iPhones only allow sound to start inside a
  // real user gesture (a finger lifting off counts, a finger touching down may not),
  // and by default they mute web sound when the silent switch / Silent Mode is on.
  function initAudio(gestureEnd = false) {
    // iOS 17+: treat this page like a media player so Silent Mode doesn't mute it.
    try { if (navigator.audioSession && navigator.audioSession.type !== 'playback') navigator.audioSession.type = 'playback'; } catch (e) { /* ignore */ }
    if (!audio) {
      try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
    }
    if (audio && audio.state !== 'running') {
      try { const r = audio.resume(); if (r) r.catch(() => {}); } catch (e) { /* ignore */ }
      // Playing a tiny buffer inside the gesture is what unlocks Web Audio on older iOS.
      try { const src = audio.createBufferSource(); src.buffer = audio.createBuffer(1, 1, 22050); src.connect(audio.destination); src.start(0); } catch (e) { /* ignore */ }
    }
    // Older iOS: playing an <audio> element switches the page to "playback" audio,
    // which also lets Web Audio be heard with the silent switch on.
    if (!htmlAudioUnlocked) {
      try {
        const el = new Audio(silentWavURL());
        el.setAttribute('playsinline', '');
        const r = el.play();
        if (r) r.then(() => { htmlAudioUnlocked = true; }).catch(() => {});
      } catch (e) { /* ignore */ }
    }
    // Speech also needs one utterance started from a gesture before it will talk.
    if (gestureEnd && !speechUnlocked && window.speechSynthesis && !muted) {
      speechUnlocked = true;
      try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; window.speechSynthesis.speak(u); } catch (e) { /* ignore */ }
    }
  }
  function tone(freq, dur, type = 'sine', vol = 0.15, slide = 0, delay = 0) {
    if (!audio || muted) return;
    const t = audio.currentTime + delay;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(audio.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  const sfx = {
    catch: () => { tone(660, 0.12, 'triangle'); tone(990, 0.15, 'triangle', 0.12, 0, 0.08); },
    boing: () => tone(200, 0.35, 'square', 0.08, 500),
    giggle: () => { for (let i = 0; i < 4; i++) tone(900 + i * 80, 0.07, 'sine', 0.07, 0, i * 0.08); },
    plop: () => tone(300, 0.1, 'sine', 0.08, -150),
    pop: () => tone(420, 0.08, 'sine', 0.08, 300),
    flip: () => tone(700, 0.06, 'triangle', 0.1, 200),
    nope: () => { tone(300, 0.16, 'sine', 0.12, -60); tone(240, 0.22, 'sine', 0.1, -50, 0.15); },
    oops: () => { tone(500, 0.12, 'triangle', 0.1, -200); tone(350, 0.18, 'triangle', 0.1, -150, 0.12); },
    click: () => tone(520, 0.08, 'triangle', 0.12),
    count: n => tone(380 + n * 55, 0.14, 'triangle', 0.12),
    fanfare: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.3, 'triangle', 0.14, 0, i * 0.15)),
    yay: () => [659, 784, 1047].forEach((f, i) => tone(f, 0.18, 'triangle', 0.13, 0, i * 0.1)),
  };
  // ---------------------------------------------------------------------
  //  Background music: each scene has its own original 8-bar tune,
  //  synthesized and looped. Notes are scheduled a little ahead from the
  //  main loop (updateMusic), and the tune switches when the scene changes.
  // ---------------------------------------------------------------------
  let musicOn = true;
  try { musicOn = localStorage.getItem('grizzly-music') !== 'off'; } catch (e) { /* ignore */ }
  function setMusic(on) {
    musicOn = on;
    try { localStorage.setItem('grizzly-music', on ? 'on' : 'off'); } catch (e) { /* ignore */ }
  }
  const midi = n => 440 * Math.pow(2, (n - 69) / 12);
  // One tune per scene key. melody: MIDI notes, 8 steps (eighth notes) per bar, 0 = rest.
  // bass: chord root per bar. lead: oscillator type. len: note length in steps.
  // bassEvery: steps between bass notes (2 = every beat, 4 = every other beat).
  const SONGS = {
    // Cheerful theme. C G Am F | C F G C
    menu: { bpm: 112, lead: 'triangle', vol: 0.1, len: 1.6, bassEvery: 2, bass: [48, 43, 45, 41, 48, 41, 43, 48], melody: [
      76, 79, 79, 76, 72, 0, 74, 76,   74, 0, 71, 74, 67, 0, 0, 0,
      72, 76, 81, 76, 72, 0, 71, 72,   81, 79, 77, 76, 74, 0, 0, 0,
      76, 79, 84, 79, 76, 0, 79, 0,    77, 81, 84, 81, 77, 0, 76, 74,
      74, 76, 77, 74, 71, 0, 74, 0,    72, 0, 67, 0, 72, 0, 0, 0] },
    // Catch: fast and bouncy. G D Em C | G C D G
    catch: { bpm: 132, lead: 'square', vol: 0.045, len: 1.2, bassEvery: 2, bass: [43, 38, 40, 36, 43, 36, 38, 43], melody: [
      67, 71, 74, 71, 79, 0, 74, 0,    74, 78, 81, 78, 74, 0, 69, 0,
      76, 79, 83, 79, 76, 0, 71, 0,    72, 76, 79, 76, 72, 74, 76, 0,
      79, 0, 78, 0, 76, 0, 74, 0,      72, 0, 76, 0, 79, 0, 76, 0,
      74, 76, 78, 79, 81, 0, 78, 0,    79, 0, 74, 0, 67, 0, 0, 0] },
    // Boop!: short poppy notes. F C F C | Bb F C F
    boop: { bpm: 120, lead: 'sine', vol: 0.14, len: 0.8, bassEvery: 4, bass: [41, 36, 41, 36, 46, 41, 36, 41], melody: [
      72, 0, 72, 0, 77, 0, 0, 74,      76, 0, 72, 0, 67, 0, 0, 0,
      69, 0, 72, 0, 77, 0, 81, 0,      79, 0, 76, 0, 72, 0, 0, 0,
      74, 0, 77, 0, 82, 0, 77, 0,      81, 0, 77, 0, 72, 0, 77, 0,
      79, 0, 0, 76, 74, 0, 72, 0,      77, 0, 72, 0, 65, 0, 0, 0] },
    // Match: slow and calm, for thinking. C Am F G | C Am F G
    match: { bpm: 92, lead: 'sine', vol: 0.12, len: 2.6, bassEvery: 4, bass: [48, 45, 41, 43, 48, 45, 41, 43], melody: [
      72, 0, 76, 0, 79, 0, 76, 0,      72, 0, 76, 0, 81, 0, 76, 0,
      72, 0, 77, 0, 81, 0, 77, 0,      71, 0, 74, 0, 79, 0, 74, 0,
      84, 0, 0, 0, 83, 0, 79, 0,       81, 0, 0, 0, 79, 0, 76, 0,
      77, 0, 76, 0, 74, 0, 72, 0,      74, 0, 0, 0, 71, 0, 0, 0] },
    // Count: a march that climbs 1-2-3-4. D A G D | G D A D
    count: { bpm: 104, lead: 'triangle', vol: 0.11, len: 1.4, bassEvery: 2, bass: [38, 45, 43, 38, 43, 38, 45, 38], melody: [
      62, 0, 66, 0, 69, 0, 74, 0,      73, 0, 69, 0, 64, 0, 0, 0,
      67, 0, 71, 0, 74, 0, 79, 0,      78, 0, 74, 0, 69, 0, 0, 0,
      71, 71, 71, 0, 74, 74, 74, 0,    69, 69, 69, 0, 66, 0, 62, 0,
      64, 0, 66, 0, 67, 0, 69, 0,      74, 0, 0, 0, 62, 0, 0, 0] },
    // Add: bright and skippy. C F G C | Am F G C
    add: { bpm: 116, lead: 'triangle', vol: 0.1, len: 1.5, bassEvery: 2, bass: [48, 41, 43, 48, 45, 41, 43, 48], melody: [
      72, 74, 76, 0, 76, 0, 79, 0,     77, 0, 76, 0, 74, 0, 72, 0,
      74, 76, 77, 0, 77, 0, 81, 0,     79, 0, 76, 0, 72, 0, 0, 0,
      76, 0, 81, 0, 81, 79, 76, 0,     77, 0, 81, 0, 84, 0, 81, 0,
      79, 0, 77, 0, 76, 0, 74, 0,      72, 0, 0, 0, 0, 0, 0, 0] },
    // Take Away: a sneaky tiptoe tune. Am E Am E | F C E Am
    sub: { bpm: 100, lead: 'sine', vol: 0.14, len: 0.7, bassEvery: 4, bass: [45, 40, 45, 40, 41, 48, 40, 45], melody: [
      69, 0, 72, 0, 76, 0, 72, 0,      71, 0, 68, 0, 64, 0, 0, 0,
      69, 0, 72, 0, 76, 0, 81, 0,      80, 0, 76, 0, 71, 0, 0, 0,
      77, 0, 76, 0, 74, 0, 72, 0,      72, 0, 76, 0, 79, 0, 0, 0,
      74, 0, 77, 0, 76, 0, 80, 0,      81, 0, 0, 0, 69, 0, 0, 0] },
  };
  let musicGain = null, musicNext = 0, musicStep = 0, musicLevel = -1, songKey = 'menu', playingKey = null;

  function musicNote(freq, t, dur, type, vol) {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(musicGain);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function updateMusic() {
    if (!audio || audio.state !== 'running') return;
    if (!musicGain) { musicGain = audio.createGain(); musicGain.gain.value = 0; musicGain.connect(audio.destination); }
    // Quieter while the game is talking, so instructions stay easy to hear.
    const speaking = !!(window.speechSynthesis && window.speechSynthesis.speaking);
    const level = muted || !musicOn ? 0 : speaking ? 0.3 : 1;
    if (level !== musicLevel) { musicLevel = level; musicGain.gain.setTargetAtTime(level * 0.5, audio.currentTime, 0.12); }
    if (level === 0) { musicNext = 0; return; }
    const now = audio.currentTime;
    if (musicNext < now) musicNext = now + 0.05;
    // A new scene starts its own tune from the top.
    if (playingKey !== songKey) { playingKey = songKey; musicStep = 0; }
    const song = SONGS[songKey] || SONGS.menu, step = 60 / song.bpm / 2;
    while (musicNext < now + 0.25) {
      const s = musicStep % song.melody.length, bar = Math.floor(s / 8), beat = s % 8;
      const note = song.melody[s];
      if (note) musicNote(midi(note), musicNext, step * song.len, song.lead, song.vol);
      if (beat % song.bassEvery === 0) {
        // alternate the chord root and its fifth (root-fifth-root-fifth, or root-fifth)
        const fifth = song.bassEvery === 2 ? beat % 4 === 2 : beat === 4;
        musicNote(midi(song.bass[bar] + (fifth ? 7 : 0)), musicNext, step * song.bassEvery * 0.9, 'sine', 0.16);
      }
      musicNext += step; musicStep++;
    }
  }

  // Reads short instructions aloud so pre-readers can play.
  // queue = true waits for anything already being said instead of cutting it off.
  function say(words, queue = false) {
    if (muted || !window.speechSynthesis) return;
    try {
      if (!queue) window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(words);
      u.rate = 0.95; u.pitch = 1.2;
      window.speechSynthesis.speak(u);
    } catch (e) { /* voice not available */ }
  }

  // =====================================================================
  //  Drawing helpers
  // =====================================================================
  let time = 0;
  const LEMMING_COLORS = ['#f2c27b', '#e8a35c', '#f5e6c8', '#d98b4a', '#fff1d6'];

  function ellipse(x, y, rx, ry, color, rot = 0) {
    ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
  }
  function circle(x, y, r, color) { ellipse(x, y, r, r, color); }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function text(str, x, y, size, color = '#fff', stroke = '#5a3311', align = 'center') {
    ctx.font = `bold ${size}px "Comic Sans MS", "Chalkboard SE", "Comic Neue", sans-serif`;
    ctx.textAlign = align; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.lineWidth = size / 5; ctx.strokeStyle = stroke;
    ctx.strokeText(str, x, y); ctx.fillStyle = color; ctx.fillText(str, x, y);
  }
  function drawStar(x, y, r, color) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = i / 10 * Math.PI * 2 - Math.PI / 2, rr = i % 2 ? r / 2.2 : r;
      ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fillStyle = color; ctx.fill();
  }
  function drawHeart(x, y, s, color) {
    ctx.beginPath(); ctx.fillStyle = color;
    ctx.moveTo(x, y + s * 0.6);
    ctx.bezierCurveTo(x - s * 1.2, y - s * 0.2, x - s * 0.5, y - s * 1.1, x, y - s * 0.4);
    ctx.bezierCurveTo(x + s * 0.5, y - s * 1.1, x + s * 1.2, y - s * 0.2, x, y + s * 0.6);
    ctx.fill();
  }

  const clouds = [];
  for (let i = 0; i < 5; i++) clouds.push({ x: rand(0, W), y: rand(30, 120), s: rand(0.6, 1.2), v: rand(8, 20) });

  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
    sky.addColorStop(0, '#7ec8f2'); sky.addColorStop(1, '#d9f1ff');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

    circle(840, 80, 46, '#ffe066');
    ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    for (let i = 0; i < 10; i++) {
      const a = i / 10 * Math.PI * 2 + time * 0.3;
      ctx.beginPath(); ctx.moveTo(840 + Math.cos(a) * 58, 80 + Math.sin(a) * 58);
      ctx.lineTo(840 + Math.cos(a) * 74, 80 + Math.sin(a) * 74); ctx.stroke();
    }
    for (const c of clouds) {
      ctx.save(); ctx.translate(c.x, c.y); ctx.scale(c.s, c.s);
      circle(0, 0, 26, '#fff'); circle(28, -10, 32, '#fff'); circle(58, 0, 24, '#fff'); ctx.fillRect(0, 0, 58, 24);
      ctx.restore();
    }

    ctx.fillStyle = '#a8c7a0';
    ctx.beginPath(); ctx.moveTo(0, 360);
    for (let x = 0; x <= W; x += 40) ctx.lineTo(x, 330 - Math.sin(x / 120) * 40 - Math.cos(x / 53) * 15);
    ctx.lineTo(W, GROUND); ctx.lineTo(0, GROUND); ctx.fill();

    for (let i = 0; i < 12; i++) {
      const x = i * 85 + 20, h = 120 + (i * 37 % 50);
      ctx.fillStyle = '#5b3a1e'; ctx.fillRect(x - 6, GROUND - 40, 12, 40);
      ctx.fillStyle = i % 2 ? '#2f7d46' : '#3a8f52';
      for (let k = 0; k < 3; k++) {
        ctx.beginPath();
        ctx.moveTo(x, GROUND - h + k * 30);
        ctx.lineTo(x - 40 + k * 4, GROUND - 40 - (2 - k) * 25);
        ctx.lineTo(x + 40 - k * 4, GROUND - 40 - (2 - k) * 25);
        ctx.fill();
      }
    }

    for (let i = 0; i < 14; i++) circle(i * 75, 60 + Math.sin(i * 1.7) * 18, 70, i % 2 ? '#3f9b55' : '#4caf63');
    for (let i = 0; i < 14; i++) circle(i * 75 + 35, 100 + Math.cos(i) * 10, 40, '#56bb6d');
    for (let i = 0; i < 20; i++) circle((i * 53) % W + 10, 70 + (i * 29 % 60), 5, '#e84a5f');

    ctx.fillStyle = '#6cc25f'; ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = '#5aae4f'; ctx.fillRect(0, GROUND, W, 8);
    drawFlowers(GROUND + 25, 40);
  }
  function drawFlowers(top, spread) {
    for (let i = 0; i < 18; i++) {
      const fx = (i * 113) % W + 15, fy = top + (i * 17 % spread);
      const col = ['#ff8fab', '#ffd93d', '#ffffff', '#c77dff'][i % 4];
      for (let p = 0; p < 5; p++) {
        const a = p / 5 * Math.PI * 2;
        circle(fx + Math.cos(a) * 6, fy + Math.sin(a) * 6, 5, col);
      }
      circle(fx, fy, 4, '#f4a261');
    }
  }

  // ---------------------------------------------------------------------
  //  Cartoon style: every shape gets a dark ink outline and soft shading.
  //  Shapes are drawn back to front, so each fill covers the outlines behind it.
  // ---------------------------------------------------------------------
  const INK = '#3b2412';
  function blob(x, y, rx, ry, fill, rot = 0, lw = 3) {
    ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2);
    ctx.fillStyle = fill; ctx.fill();
    ctx.lineWidth = lw; ctx.strokeStyle = INK; ctx.stroke();
  }
  // Radial shading, lighter toward the top-left like a light from above.
  function shade(x, y, r, base, light) {
    const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.45, r * 0.1, x, y, r * 1.15);
    g.addColorStop(0, light); g.addColorStop(1, base);
    return g;
  }
  // True for a short moment every few seconds, so eyes blink at different times.
  function blinking(seed) { return ((time + seed * 1.37) % 3.7) < 0.13; }
  function inkLine(lw = 3) { ctx.lineWidth = lw; ctx.strokeStyle = INK; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }

  // Grizzly. o = { facing, walk, moving, happy, dance, pose, squash, look }
  //   pose: 'rest' | 'up' (arms up) | 'dance' | 'scratch' (puzzled, scratching his head) | 'rub' (rubbing his tummy)
  //   squash: > 0 squashes flat, < 0 stretches tall
  function drawBear(x, groundY, scale = 1, o = {}) {
    const facing = o.facing || 1, walk = o.walk || 0, moving = !!o.moving, dance = !!o.dance;
    const pose = o.pose || (dance ? 'dance' : o.happy ? 'up' : 'rest');
    const happy = o.happy || dance || pose === 'rub' || pose === 'up';
    const puzzled = pose === 'scratch';
    const step = Math.sin(dance ? time * 10 : walk);
    const bob = (moving || dance) ? Math.abs(step) * 6 : Math.sin(time * 2.2) * 1.5; // idle: gentle breathing
    const f = dance ? (Math.sin(time * 4) > 0 ? 1 : -1) : facing;
    const sq = o.squash || 0;
    const FUR = '#8b5a2b', FUR_LIGHT = '#b47d47', FUR_DARK = '#6e4320', TAN = '#e8b77f', TAN_LIGHT = '#f8dcb0';

    ctx.save();
    ctx.translate(x, groundY);
    ctx.scale(scale, scale);
    ellipse(0, 4, 62, 11, 'rgba(0,0,0,.18)');
    ctx.scale(1 + sq, 1 - sq);

    // feet with paw pads
    const lift = moving ? 8 : 0;
    [[-26, Math.max(0, step)], [26, Math.max(0, -step)]].forEach(([fx, up]) => {
      blob(fx, -14 - up * lift, 22, 15, FUR_DARK);
      ellipse(fx + f * 4, -12 - up * lift, 11, 7, TAN);
    });
    ctx.translate(0, -bob);

    // body and tummy
    blob(0, -62, 56, 58, shade(0, -62, 58, FUR, FUR_LIGHT), 0, 3.5);
    ellipse(0, -54, 35, 39, shade(0, -54, 39, TAN, TAN_LIGHT));

    // arms: angle 0 hangs straight down; positive swings the left arm outward
    const UP = Math.PI - 0.5;
    let left = 0.35 + Math.sin(time * 2.2) * 0.05, right = -0.35 - Math.sin(time * 2.2) * 0.05;
    if (pose === 'up') { left = UP; right = -UP; }
    if (pose === 'dance') { left = UP + Math.sin(time * 8) * 0.5; right = -UP + Math.sin(time * 8 + 1) * 0.5; }
    if (pose === 'scratch') right = -(Math.PI - 0.15) + Math.sin(time * 22) * 0.12;
    if (pose === 'rub') left = -1.15 + Math.sin(time * 10) * 0.28;
    const drawArm = (side, a) => {
      ctx.save(); ctx.translate(side * 46, -90); ctx.rotate(a);
      blob(0, 24, 15, 29, shade(0, 24, 29, FUR_DARK, FUR));
      blob(0, 50, 12, 11, FUR_DARK, 0, 2.5);
      ctx.restore();
    };
    drawArm(-1, left);
    if (!puzzled) drawArm(1, right); // the head-scratching arm is drawn in front of the head, below

    // head
    const hx = f * 4, hy = -132;
    [-1, 1].forEach(side => {
      blob(hx + side * 35, hy - 38, 18, 18, FUR_DARK);
      ellipse(hx + side * 35, hy - 37, 9, 9, TAN);
    });
    blob(hx, hy, 51, 46, shade(hx, hy, 51, FUR, FUR_LIGHT), 0, 3.5);
    // tuft of fur on top
    ctx.fillStyle = FUR; inkLine(3);
    ctx.beginPath(); ctx.moveTo(hx - 10, hy - 44); ctx.quadraticCurveTo(hx - 4, hy - 60, hx + 2, hy - 45);
    ctx.quadraticCurveTo(hx + 8, hy - 58, hx + 12, hy - 44); ctx.fill(); ctx.stroke();
    // muzzle and nose
    const mx = hx + f * 8;
    blob(mx, hy + 19, 26, 19, TAN_LIGHT, 0, 2.5);
    blob(mx, hy + 9, 11, 7.5, '#2b1a0e', 0, 2);
    circle(mx - 3, hy + 7, 2.6, 'rgba(255,255,255,.75)');
    // cheeks
    circle(hx - 33, hy + 14, 8, 'rgba(255,120,120,.4)'); circle(hx + 33, hy + 14, 8, 'rgba(255,120,120,.4)');

    // eyes
    const look = o.look || 0;
    const eyes = [hx - 17 + f * 5, hx + 17 + f * 5], ey = hy - 11;
    if (happy && !puzzled) {
      inkLine(4.5);
      eyes.forEach(ex => { ctx.beginPath(); ctx.arc(ex, ey + 3, 8, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); });
    } else if (blinking(0.5)) {
      inkLine(4);
      eyes.forEach(ex => { ctx.beginPath(); ctx.moveTo(ex - 7, ey); ctx.lineTo(ex + 7, ey); ctx.stroke(); });
    } else {
      eyes.forEach(ex => {
        blob(ex, ey, 9.5, 11.5, '#fff', 0, 2.5);
        circle(ex + f * 2.5 + look * 3, ey + 1.5, 5.8, '#2b1a0e');
        circle(ex + f * 2.5 + look * 3 - 1.8, ey - 1.2, 2.1, '#fff');
      });
    }
    // eyebrows: one raised when puzzled
    inkLine(3.5);
    eyes.forEach((ex, i) => {
      const tilt = puzzled ? (i === 0 ? 3 : -4) : happy ? -1.5 : 0;
      const lift2 = puzzled && i === 1 ? -5 : 0;
      ctx.beginPath(); ctx.moveTo(ex - 7, ey - 17 + tilt + lift2); ctx.lineTo(ex + 7, ey - 17 - tilt + lift2); ctx.stroke();
    });

    // mouth
    const my = hy + 27;
    if (puzzled) {
      inkLine(3);
      ctx.beginPath(); ctx.moveTo(mx - 9, my); ctx.quadraticCurveTo(mx - 4, my - 5, mx, my); ctx.quadraticCurveTo(mx + 4, my + 5, mx + 9, my); ctx.stroke();
    } else if (happy) {
      ctx.beginPath(); ctx.arc(mx, my - 2, 11, 0.05 * Math.PI, 0.95 * Math.PI); ctx.closePath();
      ctx.fillStyle = '#8e2b2b'; ctx.fill(); inkLine(3); ctx.stroke();
      ctx.save(); ctx.clip(); ellipse(mx, my + 8, 6, 4, '#ff7a8a'); ctx.restore();
    } else {
      inkLine(3);
      ctx.beginPath(); ctx.arc(mx, my - 4, 8, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
    }
    if (puzzled) drawArm(1, right);
    ctx.restore();
  }

  // A lemming standing on (m.x, m.y).
  //   m.face: 'happy' | 'dizzy' | 'cheeky' | undefined (carrying a treat makes it cheeky)
  //   m.squash: > 0 squashes flat, < 0 stretches tall. m.seed: keeps blinks and ear wiggles out of sync.
  function drawLemming(m) {
    ctx.save();
    ctx.translate(m.x, m.y - (m.hop || 0));
    if (m.rot) { ctx.translate(0, -18); ctx.rotate(m.rot); ctx.translate(0, 18); }
    const sq = m.squash || 0;
    ctx.scale((m.dir || 1) * (1 + sq), 1 - sq);
    const color = m.color || LEMMING_COLORS[0];
    const seed = m.seed || 0;
    const s = Math.sin(m.step || 0);
    const LW = 1.8;

    blob(-7 + s * 4, -3, 6, 4, '#e07a5f', 0, LW);
    blob(7 - s * 4, -3, 6, 4, '#e07a5f', 0, LW);
    blob(-20, -13, 5.5, 5, color, 0, LW);
    // ears, with an occasional wiggle
    const wiggle = Math.sin(time * 1.3 + seed) > 0.6 ? Math.sin(time * 14 + seed * 2) * 0.3 : 0;
    [[-7, -0.35 - wiggle], [9, 0.3 + wiggle]].forEach(([ex, a]) => {
      ctx.save(); ctx.translate(ex, -33); ctx.rotate(a);
      blob(0, -3, 6, 7.5, color, 0, LW); ellipse(0, -3, 3, 4.5, '#ffb3c1');
      ctx.restore();
    });
    blob(0, -19, 21, 18, shade(0, -19, 21, color, '#fff8ea'), 0, 2);
    ellipse(5, -13, 12, 10, '#fffaf0');

    const face = m.mode === 'fly' ? 'dizzy' : m.face || (m.carry ? 'cheeky' : undefined);
    const EYES = [5, 15], EY = -24;
    inkLine(2.2);
    if (face === 'dizzy') {
      // swirly eyes
      EYES.forEach(ex => {
        ctx.beginPath();
        for (let a = 0; a < Math.PI * 4; a += 0.3) ctx.lineTo(ex + Math.cos(a + time * 8) * a * 0.45, EY + Math.sin(a + time * 8) * a * 0.45);
        ctx.stroke();
      });
    } else if (face === 'happy') {
      EYES.forEach(ex => { ctx.beginPath(); ctx.arc(ex, EY + 3, 4.5, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); });
    } else {
      EYES.forEach((ex, i) => {
        if (blinking(seed) || (face === 'cheeky' && i === 0)) {
          // closed eye, or a wink when being cheeky
          ctx.beginPath(); ctx.arc(ex, EY + 2, 4.5, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
        } else {
          blob(ex, EY, 6, 7, '#fff', 0, 1.5);
          circle(ex + 1.5, EY + 0.5, 3.7, '#222');
          circle(ex + 2.6, EY - 1.4, 1.4, '#fff');
        }
      });
    }
    circle(1, -16, 3, 'rgba(255,120,150,.45)');
    blob(21, -18, 3.4, 3, '#ff7aa2', 0, 1.3);
    // whiskers
    inkLine(1); ctx.globalAlpha *= 0.6;
    ctx.beginPath(); ctx.moveTo(20, -16); ctx.lineTo(29, -19); ctx.moveTo(20, -15); ctx.lineTo(29, -13); ctx.stroke();
    ctx.globalAlpha /= 0.6;
    if (face === 'cheeky') {
      blob(16, -10, 3.2, 4.2, '#ff6b8a', 0, 1.3); // tongue out
    } else {
      ctx.fillStyle = '#fff'; ctx.fillRect(14, -14, 4.5, 5);
      ctx.lineWidth = 1.2; ctx.strokeStyle = INK; ctx.strokeRect(14, -14, 4.5, 5);
    }
    if (m.carry) {
      // little arms holding the treat up
      [[-6, -26, -8, -40], [10, -26, 10, -40]].forEach(([x1, y1, x2, y2]) => {
        inkLine(7); ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        ctx.lineWidth = 4.2; ctx.strokeStyle = color; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      });
    }
    ctx.restore();
  }
  function drawLemmingAt(x, y, scale, m = {}) {
    ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
    drawLemming(Object.assign({ x: 0, y: 0, dir: 1, seed: x * 0.013 + y * 0.007 }, m));
    ctx.restore();
  }

  function drawTreat(type, x, y, rot = 0, s = 1) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
    const LW = 1.8;
    if (type === 'honey') {
      blob(0, 2, 16, 15, shade(0, 2, 16, '#e89500', '#ffd25e'), 0, LW);
      ctx.fillStyle = '#c97c00'; ctx.fillRect(-12, -16, 24, 7);
      ctx.lineWidth = LW; ctx.strokeStyle = INK; ctx.strokeRect(-12, -16, 24, 7);
      blob(0, -16, 13, 4, '#efe6cc', 0, LW);
      ctx.fillStyle = '#ffd34d'; ctx.beginPath(); ctx.moveTo(-10, -9); ctx.quadraticCurveTo(-12, 6, -6, 4); ctx.quadraticCurveTo(-4, -2, 0, -9); ctx.fill();
      ellipse(6, -1, 4, 6, 'rgba(255,255,255,.55)');
    } else if (type === 'berries') {
      blob(-7, 4, 8, 8, shade(-7, 4, 8, '#3f4bc0', '#7d88ef'), 0, LW);
      blob(7, 4, 8, 8, shade(7, 4, 8, '#3f4bc0', '#7d88ef'), 0, LW);
      blob(0, -6, 8, 8, shade(0, -6, 8, '#4d5bd6', '#8f99f5'), 0, LW);
      blob(6, -15, 8, 4, '#3a8f52', -0.5, LW);
    } else if (type === 'apple') {
      ctx.fillStyle = '#5b3a1e'; ctx.fillRect(-1, -17, 3, 9);
      blob(0, 2, 16, 14, shade(0, 2, 16, '#d62839', '#ff7b84'), 0, LW);
      blob(7, -13, 7, 3.5, '#3a8f52', -0.4, LW);
      ellipse(-6, -3, 3, 5, 'rgba(255,255,255,.55)');
    } else if (type === 'fish') {
      ctx.fillStyle = '#4fb3d9'; inkLine(LW);
      ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(-27, -10); ctx.lineTo(-27, 10); ctx.closePath(); ctx.fill(); ctx.stroke();
      blob(0, 0, 18, 10, shade(0, 0, 18, '#4fb3d9', '#a6e3f7'), 0, LW);
      circle(9, -2, 3, '#fff'); circle(10, -2, 1.6, '#222');
      inkLine(1.2); ctx.beginPath(); ctx.arc(2, 0, 7, -0.9, 0.9); ctx.stroke();
    }
    ctx.restore();
  }

  // A burrow with something peeking out. up: 0 (hidden) .. 1 (all the way up)
  function drawHole(hx, hy, up, critter) {
    blob(hx, hy, 78, 26, '#6b4423', 0, 3);
    ellipse(hx, hy + 2, 64, 18, '#2b1a0e');
    if (critter && up > 0) {
      ctx.save();
      ctx.beginPath(); ctx.rect(hx - 110, hy - 240, 220, 240); ctx.clip();
      critter(hx, hy + 10 + (1 - up) * 125);
      ctx.restore();
    }
    ctx.beginPath(); ctx.ellipse(hx, hy, 76, 24, 0, 0, Math.PI);
    ctx.lineWidth = 12; ctx.strokeStyle = '#8b5a2b'; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(hx, hy, 82, 30, 0, 0.05 * Math.PI, 0.95 * Math.PI);
    ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
  }

  // =====================================================================
  //  Particles (stars, hearts, confetti, floating words)
  // =====================================================================
  let particles = [];
  function burst(x, y, color, n = 10, kind = 'star') {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(80, 240);
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 100, life: rand(0.6, 1.1), max: 1.1, color, kind, size: rand(6, 12) });
    }
  }
  function floatText(str, x, y, color = '#fff', size = 30) {
    particles.push({ x, y, vx: 0, vy: -70, life: 1.2, max: 1.2, color, kind: 'text', label: str, size });
  }
  // Little dust clouds for landings, skids and bumps.
  function puff(x, y, n = 6, spread = 70) {
    for (let i = 0; i < n; i++) {
      particles.push({ x: x + rand(-10, 10), y: y - rand(0, 8), vx: rand(-spread, spread), vy: rand(-45, -10),
        life: rand(0.45, 0.75), max: 0.75, color: '#efe4c8', kind: 'dust', size: rand(7, 13) });
    }
  }
  function updateParticles(dt) {
    for (const p of particles) {
      if (p.kind === 'dust') { p.vx *= 0.92; p.vy *= 0.92; }
      else if (p.kind !== 'text') p.vy += 400 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);
  }
  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.max * 1.5));
      if (p.kind === 'heart') drawHeart(p.x, p.y, p.size, '#ff5c8a');
      else if (p.kind === 'confetti') { ctx.fillStyle = p.color; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.life * 6); ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore(); }
      else if (p.kind === 'text') text(p.label, p.x, p.y, p.size, p.color, '#5a3311');
      else if (p.kind === 'dust') circle(p.x, p.y, p.size * (1.7 - p.life / p.max * 0.7), p.color);
      else drawStar(p.x, p.y, p.size, p.color);
    }
    ctx.globalAlpha = 1;
  }

  // =====================================================================
  //  Buttons, HUD, overlay
  // =====================================================================
  const pointer = { x: -1, y: -1, down: false };
  const buttons = [];
  function hot(x, y, w, h) { return pointer.x > x && pointer.x < x + w && pointer.y > y && pointer.y < y + h; }
  function button(label, x, y, w, h, color, action) {
    const hover = hot(x - w / 2, y - h / 2, w, h);
    const s = (1 + Math.sin(time * 4) * 0.03) * (hover ? 1.05 : 1);
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    roundRect(-w / 2, -h / 2 + 6, w, h, h / 2); ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fill();
    roundRect(-w / 2, -h / 2, w, h, h / 2); ctx.fillStyle = color; ctx.fill();
    ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.stroke();
    text(label, 0, 0, h * 0.42, '#fff', 'rgba(60,30,0,.7)');
    ctx.restore();
    buttons.push({ x: x - w / 2, y: y - h / 2, w, h, action });
  }

  function drawMute() {
    const x = W - 40, y = 30;
    circle(x, y, 22, 'rgba(255,255,255,.85)');
    ctx.fillStyle = '#5a3311';
    ctx.beginPath(); ctx.moveTo(x - 12, y - 5); ctx.lineTo(x - 5, y - 5); ctx.lineTo(x + 3, y - 12); ctx.lineTo(x + 3, y + 12); ctx.lineTo(x - 5, y + 5); ctx.lineTo(x - 12, y + 5); ctx.fill();
    ctx.strokeStyle = '#5a3311'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    if (muted) { ctx.beginPath(); ctx.moveTo(x + 7, y - 7); ctx.lineTo(x + 15, y + 7); ctx.moveTo(x + 15, y - 7); ctx.lineTo(x + 7, y + 7); ctx.stroke(); }
    else { ctx.beginPath(); ctx.arc(x + 4, y, 9, -0.8, 0.8); ctx.stroke(); }
    buttons.push({ x: x - 26, y: y - 26, w: 52, h: 52, action: () => { muted = !muted; if (muted && window.speechSynthesis) window.speechSynthesis.cancel(); } });
    drawMusicButton();
  }
  // Music on/off, beside the speaker button. Turning it off keeps sound effects and voice.
  function drawMusicButton() {
    const x = W - 96, y = 30;
    circle(x, y, 22, 'rgba(255,255,255,.85)');
    ctx.globalAlpha = musicOn ? 1 : 0.45;
    ctx.fillStyle = '#5a3311'; ctx.strokeStyle = '#5a3311'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ellipse(x - 6, y + 8, 6, 4.5, '#5a3311', -0.4);
    ellipse(x + 8, y + 5, 6, 4.5, '#5a3311', -0.4);
    ctx.beginPath(); ctx.moveTo(x - 1, y + 7); ctx.lineTo(x - 1, y - 11); ctx.lineTo(x + 13, y - 14); ctx.lineTo(x + 13, y + 4); ctx.stroke();
    ctx.globalAlpha = 1;
    if (!musicOn) {
      ctx.strokeStyle = '#d64545'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(x - 14, y - 14); ctx.lineTo(x + 14, y + 14); ctx.stroke();
    }
    buttons.push({ x: x - 26, y: y - 26, w: 52, h: 52, action: () => setMusic(!musicOn) });
  }
  function drawHome() {
    const x = 40, y = 30;
    circle(x, y, 22, 'rgba(255,255,255,.85)');
    ctx.fillStyle = '#5a3311';
    ctx.beginPath(); ctx.moveTo(x, y - 13); ctx.lineTo(x + 13, y - 1); ctx.lineTo(x - 13, y - 1); ctx.fill();
    ctx.fillRect(x - 9, y - 2, 18, 13);
    ctx.fillStyle = '#ffd93d'; ctx.fillRect(x - 3, y + 3, 6, 8);
    buttons.push({ x: x - 26, y: y - 26, w: 52, h: 52, action: () => go('menu') });
  }

  // Score panel: icon, "3 / 10", and a filling bar
  function drawProgress(icon, count, goal) {
    roundRect(76, 12, 300, 54, 27); ctx.fillStyle = 'rgba(255,255,255,.88)'; ctx.fill();
    icon(108, 40);
    text(`${count} / ${goal}`, 172, 40, 26, '#f4a300', '#5a3311');
    roundRect(226, 30, 136, 20, 10); ctx.fillStyle = '#eadbc8'; ctx.fill();
    const pw = 136 * Math.min(1, count / goal);
    if (pw > 0) { roundRect(226, 30, Math.max(20, pw), 20, 10); ctx.fillStyle = '#ffb703'; ctx.fill(); }
  }

  let overlay = null; // { title, sub, color, win, buttons: [{label, color, action}] }
  function drawOverlay() {
    const o = overlay;
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(0, 0, W, H);
    roundRect(W / 2 - 310, 90, 620, 350, 30); ctx.fillStyle = 'rgba(255,248,231,.96)'; ctx.fill();
    ctx.lineWidth = 6; ctx.strokeStyle = '#ffb703'; ctx.stroke();
    text(o.title, W / 2, 160, 56, o.color || '#f4a300', o.win ? '#fff' : '#5a3311');
    text(o.sub, W / 2, 226, 32, '#8b5a2b', '#fff');
    for (let i = 0; i < 3; i++) drawStar(W / 2 - 70 + i * 70, 290, 26 + Math.sin(time * 5 + i) * 3, '#ffd93d');
    const n = o.buttons.length;
    o.buttons.forEach((b, i) => {
      const bx = n === 1 ? W / 2 : W / 2 + (i === 0 ? -140 : 140);
      button(b.label, bx, 375, 250, 80, b.color, b.action);
    });
  }

  function celebrate(key, title, sub) {
    sfx.fanfare();
    stars[key] = (stars[key] || 0) + 1;
    saveStars();
    say(title.replace(/[^A-Za-z0-9 !,']/g, ''));
    overlay = {
      win: true, title, sub, color: '#ff5c8a',
      buttons: [
        { label: 'AGAIN ↻', color: '#ff8c42', action: () => go(key) },
        { label: 'HOME', color: '#4d96ff', action: () => go('menu') },
      ],
    };
  }

  // =====================================================================
  //  Scenes
  // =====================================================================
  const S = {};
  let scene = null;
  const keys = { left: false, right: false };
  // intro: words to say before the scene starts (scenes may queue more after it)
  function go(name, intro) {
    scene = S[name];
    songKey = name;
    overlay = null;
    particles = [];
    keys.left = keys.right = false;
    if (window.speechSynthesis) try { window.speechSynthesis.cancel(); } catch (e) { /* ignore */ }
    if (intro) say(intro);
    scene.start();
  }

  // ---------------------------------------------------------------------
  //  Menu
  // ---------------------------------------------------------------------
  const GAMES = [
    { key: 'catch', label: 'Catch', bg: '#ffe9a8', edge: '#ffb703', ink: '#a86a00', voice: 'Catch the treats!' },
    { key: 'boop', label: 'Boop!', bg: '#ffd3e0', edge: '#ff7aa2', ink: '#b8325c', voice: 'Boop the lemmings!' },
    { key: 'match', label: 'Match', bg: '#cfe3ff', edge: '#4d96ff', ink: '#1f5fbf', voice: 'Find the pairs!' },
    { key: 'count', label: 'Count', bg: '#e5d4ff', edge: '#9b5de5', ink: '#5b2a9e', voice: 'Count the lemmings!' },
    { key: 'add', label: 'Add', bg: '#d4f5d0', edge: '#4caf50', ink: '#2e7d32', voice: "Let's add!" },
    { key: 'sub', label: 'Take Away', bg: '#ffe0cc', edge: '#ff8c42', ink: '#b85a12', voice: "Let's take away!" },
  ];
  // The menu shows 6 cards per page; arrows (or swipe-free arrow keys) flip pages.
  const PER_PAGE = 6;
  let menuPage = 0;
  const pageCount = () => Math.ceil(GAMES.length / PER_PAGE);
  function flipPage(d) { menuPage = (menuPage + d + pageCount()) % pageCount(); sfx.flip(); }
  function drawPageArrow(x, y, dir) {
    const hover = hot(x - 34, y - 34, 68, 68);
    ctx.save(); ctx.translate(x, y); ctx.scale(hover ? 1.08 : 1, hover ? 1.08 : 1);
    circle(0, 5, 30, 'rgba(0,0,0,.22)');
    blob(0, 0, 30, 30, '#ffb703', 0, 4);
    ctx.fillStyle = '#fff'; inkLine(3);
    ctx.beginPath(); ctx.moveTo(dir * 13, 0); ctx.lineTo(-dir * 9, -14); ctx.lineTo(-dir * 9, 14); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
    buttons.push({ x: x - 36, y: y - 36, w: 72, h: 72, action: () => flipPage(dir) });
  }
  S.menu = {
    start() {},
    update() {},
    render() {
      drawBackground();
      for (let i = 0; i < 4; i++) {
        const x = ((time * 60 + i * 260) % (W + 100)) - 50;
        drawLemming({ x, y: GROUND + 54, dir: 1, seed: i * 2.3, color: LEMMING_COLORS[i], step: time * 14 + i, hop: Math.abs(Math.sin(time * 14 + i)) * 5 });
      }
      roundRect(W / 2 - 290, 18, 580, 112, 28); ctx.fillStyle = 'rgba(255,248,231,.94)'; ctx.fill();
      ctx.lineWidth = 6; ctx.strokeStyle = '#ffb703'; ctx.stroke();
      text('Grizzly', W / 2, 58, 50, '#8b5a2b', '#fff');
      text('and the Lemmings', W / 2, 104, 32, '#f4a300', '#5a3311');

      if (menuPage >= pageCount()) menuPage = 0;
      const pageGames = GAMES.slice(menuPage * PER_PAGE, menuPage * PER_PAGE + PER_PAGE);
      if (pageCount() > 1) {
        drawPageArrow(44, 330, -1);
        drawPageArrow(W - 44, 330, 1);
        for (let i = 0; i < pageCount(); i++) {
          const dx = W / 2 + (i - (pageCount() - 1) / 2) * 30;
          blob(dx, 527, i === menuPage ? 9 : 6, i === menuPage ? 9 : 6, i === menuPage ? '#ffb703' : '#fff8e7', 0, 2.5);
        }
      }
      pageGames.forEach((g, i) => {
        // 3 x 2 grid of cards
        const cx = 210 + (i % 3) * 270, top = 146 + Math.floor(i / 3) * 186, w = 250, h = 172;
        const hover = hot(cx - w / 2, top, w, h);
        ctx.save();
        ctx.translate(cx, top + h / 2);
        ctx.rotate(Math.sin(time * 2 + i * 1.3) * 0.015);
        ctx.scale(hover ? 1.05 : 1, hover ? 1.05 : 1);
        ctx.translate(-cx, -(top + h / 2));
        roundRect(cx - w / 2, top + 8, w, h, 26); ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fill();
        roundRect(cx - w / 2, top, w, h, 26); ctx.fillStyle = g.bg; ctx.fill();
        ctx.lineWidth = 7; ctx.strokeStyle = g.edge; ctx.stroke();
        ctx.save(); roundRect(cx - w / 2 + 4, top + 4, w - 8, h - 8, 22); ctx.clip();
        // previews are drawn for a 200 x 280 card, so shrink them to fit
        ctx.translate(cx, top + 6); ctx.scale(0.6, 0.6);
        drawPreview(g.key, 0, 0);
        ctx.restore();
        text(g.label, cx, top + 148, 34, '#fff', g.ink);
        const n = stars[g.key] || 0;
        if (n > 0) {
          drawStar(cx + w / 2 - 50, top + 26, 14, '#ffd93d');
          text(`x${n}`, cx + w / 2 - 24, top + 27, 20, g.ink, '#fff');
        }
        ctx.restore();
        buttons.push({ x: cx - w / 2, y: top, w, h, action: () => go(g.key, g.voice) });
      });
    },
  };

  // Menu card art for plug-in games: PREVIEWS[key] = (cx, top) => { ... } (drawn for a 200 x 280 card).
  const PREVIEWS = {};
  function drawPreview(key, cx, top) {
    if (PREVIEWS[key]) { PREVIEWS[key](cx, top); return; }
    if (key === 'catch') {
      drawBear(cx, top + 185, 0.55, { happy: true });
      drawTreat('honey', cx, top + 30 + (time * 50) % 45, Math.sin(time * 3) * 0.3, 1.3);
    } else if (key === 'boop') {
      const up = 0.55 + 0.45 * Math.sin(time * 3);
      ctx.save(); ctx.translate(cx, top + 165); ctx.scale(0.85, 0.85);
      drawHole(0, 0, up, (x, y) => drawLemmingAt(x, y, 2.2, { color: '#e8a35c', face: up > 0.9 ? 'happy' : undefined }));
      ctx.restore();
      drawHeart(cx + 55, top + 50 + Math.sin(time * 4) * 5, 12, '#ff5c8a');
    } else if (key === 'match') {
      [[-38, -0.15], [38, 0.15]].forEach(([dx, r], k) => {
        ctx.save(); ctx.translate(cx + dx, top + 105 + Math.sin(time * 3 + k) * 4); ctx.rotate(r);
        roundRect(-40, -52, 80, 104, 12); ctx.fillStyle = '#fff8e7'; ctx.fill();
        ctx.lineWidth = 4; ctx.strokeStyle = '#4d96ff'; ctx.stroke();
        drawTreat('honey', 0, 2, 0, 1.4);
        ctx.restore();
      });
    } else if (key === 'count') {
      [-55, 0, 55].forEach((dx, k) => {
        const j = Math.max(0, Math.sin(time * 4 - k * 0.9)) * 12;
        drawLemmingAt(cx + dx, top + 175 - j, 1.3, { color: LEMMING_COLORS[k + 1] });
        circle(cx + dx, top + 85, 17, '#fff');
        text(String(k + 1), cx + dx, top + 86, 24, '#9b5de5', '#fff');
      });
    } else if (key === 'add') {
      text('2 + 1', cx, top + 70, 52, '#fff', '#2e7d32');
      const j = Math.max(0, Math.sin(time * 4)) * 10;
      drawLemmingAt(cx - 70, top + 185, 1.2, { color: '#e8a35c' });
      drawLemmingAt(cx - 25, top + 185, 1.2, { color: '#e8a35c' });
      text('+', cx + 15, top + 160, 40, '#fff', '#2e7d32');
      drawLemmingAt(cx + 60, top + 185 - j, 1.2, { color: '#f5e6c8', dir: -1 });
    } else if (key === 'sub') {
      text('3 − 1', cx, top + 70, 52, '#fff', '#b85a12');
      drawTreat('honey', cx - 70, top + 165, 0, 1.4);
      drawTreat('honey', cx - 25, top + 165, 0, 1.4);
      ctx.globalAlpha = 0.3; drawTreat('honey', cx + 20, top + 165, 0, 1.4); ctx.globalAlpha = 1;
      const run = (time * 40) % 50;
      drawLemmingAt(cx + 50 + run, top + 190 - Math.abs(Math.sin(time * 14)) * 4, 1.2, { color: '#d98b4a', carry: true, step: time * 14 });
      drawTreat('honey', cx + 50 + run, top + 128, 0, 1.1);
    }
  }

  // ---------------------------------------------------------------------
  //  Game 1: Catch — move Grizzly to catch falling treats
  // ---------------------------------------------------------------------
  S.catch = (() => {
    const LEVELS = [
      { goal: 10, fall: 110, treatEvery: 1.6, lemmingEvery: 5.5, lemSpeed: [50, 70] },
      { goal: 15, fall: 150, treatEvery: 1.3, lemmingEvery: 3.8, lemSpeed: [60, 90] },
      { goal: 20, fall: 190, treatEvery: 1.05, lemmingEvery: 2.8, lemSpeed: [70, 110] },
    ];
    const TREATS = ['honey', 'berries', 'apple', 'honey', 'fish'];
    // happy: seconds of celebrating a catch (arms up first, then a tummy rub). squash: catch bounce.
    const bear = { x: W / 2, target: null, facing: 1, walk: 0, happy: 0, squash: 0, lastMove: 0, moving: false };
    let level = 0, caught = 0, bonks = 0, treats = [], lemmings = [], treatTimer = 0, lemTimer = 0, levelTime = 0;

    function startLevel(n) {
      level = n; caught = 0; treats = []; lemmings = [];
      treatTimer = 0.5; lemTimer = 3; levelTime = 0;
      bear.x = W / 2; bear.target = null;
    }
    function scoreOne(t) {
      t.dead = true; caught++; bear.happy = 1.1; bear.squash = 0.14;
      sfx.catch(); burst(t.x, t.y, '#ffd93d', 12);
      if (caught >= LEVELS[level].goal) {
        if (level === LEVELS.length - 1) {
          celebrate('catch', 'You did it!', bonks ? `Full tummy! ${bonks} lemmings bumped` : 'Grizzly has a full tummy!');
        } else {
          sfx.fanfare(); say('Yummy!');
          burst(bear.x, GROUND - 150, '#ff5c8a', 30, 'heart');
          overlay = {
            title: 'Yummy!', sub: `Level ${level + 1} done!`,
            buttons: [{ label: 'NEXT ▶', color: '#4caf50', action: () => { overlay = null; startLevel(level + 1); } }],
          };
        }
      }
    }

    return {
      start() { bonks = 0; startLevel(0); },
      update(dt) {
        if (overlay) { bear.walk += dt * 6; return; }
        const L = LEVELS[level];
        levelTime += dt;

        let move = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
        if (move !== 0) bear.target = null;
        if (bear.target !== null && Math.abs(bear.target - bear.x) > 6) move = Math.sign(bear.target - bear.x);
        bear.moving = move !== 0;
        // a little dust cloud when Grizzly sets off or skids round
        if (move && move !== bear.lastMove) puff(bear.x - move * 30, GROUND, 5);
        bear.lastMove = move;
        if (move) {
          bear.x += move * 360 * dt;
          if (bear.target !== null && Math.sign(bear.target - bear.x) !== move) bear.x = bear.target;
          bear.facing = move; bear.walk += dt * 12;
        }
        bear.x = Math.max(60, Math.min(W - 60, bear.x));
        bear.happy = Math.max(0, bear.happy - dt);
        bear.squash = Math.max(0, bear.squash - dt * 0.7);

        treatTimer -= dt;
        if (treatTimer <= 0) {
          treats.push({ x: rand(80, W - 80), y: 120, vy: 0, type: pick(TREATS), rot: rand(-0.3, 0.3), spin: rand(-1.5, 1.5), grounded: false, life: 5, held: false });
          treatTimer = L.treatEvery * rand(0.8, 1.2);
        }
        lemTimer -= dt;
        if (lemTimer <= 0) {
          const fromLeft = Math.random() < 0.5;
          lemmings.push({ x: fromLeft ? -30 : W + 30, y: GROUND, dir: fromLeft ? 1 : -1, speed: rand(L.lemSpeed[0], L.lemSpeed[1]),
            color: pick(LEMMING_COLORS), mode: 'walk', carry: null, vx: 0, vy: 0, rot: 0, step: rand(0, 6), hop: 0, seed: rand(0, 10) });
          lemTimer = L.lemmingEvery * rand(0.8, 1.2);
        }

        for (const t of treats) {
          if (t.held || overlay) continue;
          if (!t.grounded) {
            t.vy = Math.min(L.fall, t.vy + 300 * dt);
            t.y += t.vy * dt; t.rot += t.spin * dt;
            if (t.y > GROUND - 190 && t.y < GROUND - 80 && Math.abs(t.x - bear.x) < 70) { scoreOne(t); continue; }
            if (t.y >= GROUND - 14) { t.y = GROUND - 14; t.grounded = true; t.rot = 0; sfx.plop(); puff(t.x, GROUND, 3, 40); }
          } else {
            t.life -= dt;
            if (Math.abs(t.x - bear.x) < 45) { scoreOne(t); continue; }
            if (t.life <= 0) t.dead = true;
          }
        }

        for (const m of lemmings) {
          m.step += dt * 14;
          if (m.mode === 'walk' || m.mode === 'run') {
            m.x += m.dir * (m.mode === 'run' ? m.speed * 1.8 : m.speed) * dt;
            m.hop = Math.abs(Math.sin(m.step)) * 5;
            if (m.mode === 'walk') {
              for (const t of treats) {
                if (t.grounded && !t.held && !t.dead && Math.abs(t.x - m.x) < 18) {
                  t.held = true; m.carry = t; m.mode = 'run';
                  m.dir = m.x < W / 2 ? -1 : 1;
                  sfx.giggle();
                  break;
                }
              }
            }
            if (Math.abs(m.x - bear.x) < 55) {
              m.mode = 'fly';
              m.vx = (m.x < bear.x ? -1 : 1) * rand(150, 250);
              m.vy = -rand(420, 520);
              bonks++; sfx.boing();
              burst(m.x, m.y - 20, '#fff', 8, 'heart');
              puff(m.x, GROUND, 8);
              if (m.carry) {
                const t = m.carry; t.held = false; t.grounded = false; t.y = m.y - 60; t.x = m.x; t.vy = -200; t.life = 5;
                m.carry = null;
              }
            }
            if (m.x < -60 || m.x > W + 60) { m.dead = true; if (m.carry) m.carry.dead = true; }
          } else {
            m.vy += 700 * dt; m.x += m.vx * dt; m.y += m.vy * dt; m.rot += dt * 10;
            if (m.y > H + 60 || m.x < -80 || m.x > W + 80) m.dead = true;
          }
          if (m.carry) { m.carry.x = m.x; m.carry.y = m.y - 46 - m.hop; }
        }
        treats = treats.filter(t => !t.dead);
        lemmings = lemmings.filter(m => !m.dead);
      },
      render() {
        drawBackground();
        for (const t of treats) {
          if (t.held) continue;
          if (t.grounded && t.life < 1.5 && Math.floor(time * 8) % 2) continue;
          drawTreat(t.type, t.x, t.y, t.rot);
        }
        const pose = overlay ? undefined : bear.happy > 0.75 ? 'up' : bear.happy > 0 ? 'rub' : undefined;
        drawBear(bear.x, GROUND, 1, { facing: bear.facing, walk: bear.walk, moving: bear.moving, pose, squash: bear.squash, dance: !!overlay });
        for (const m of lemmings) {
          drawLemming(m);
          if (m.carry) drawTreat(m.carry.type, m.carry.x, m.carry.y, 0, 0.9);
        }
        drawProgress((x, y) => drawTreat('honey', x, y), caught, LEVELS[level].goal);
        for (let i = 0; i < LEVELS.length; i++) drawStar(W / 2 + 60 + i * 40, 38, 16, i <= level ? '#ffd93d' : 'rgba(255,255,255,.6)');
        if (!overlay && levelTime < 2) {
          ctx.globalAlpha = Math.min(1, 2 - levelTime);
          text(`Level ${level + 1}`, W / 2, H / 2 - 60, 72, '#ffd93d', '#5a3311');
          ctx.globalAlpha = 1;
        }
      },
      pointer(p) { bear.target = p.x; },
      drag(p) { bear.target = p.x; },
    };
  })();

  // ---------------------------------------------------------------------
  //  Game 2: Boop! — tap lemmings that pop out of holes (not Grizzly!)
  // ---------------------------------------------------------------------
  S.boop = (() => {
    const GOAL = 15;
    const holes = [];
    for (const y of [315, 455]) for (const x of [200, 480, 760]) holes.push({ x, y });
    let count = 0, spawnT = 0, doneT = 0;

    return {
      start() {
        count = 0; spawnT = 1; doneT = 0;
        for (const h of holes) Object.assign(h, { who: null, up: 0, phase: 'up', stay: 0, booped: false, color: '#f2c27b', dir: 1 });
      },
      update(dt) {
        if (overlay) return;
        if (doneT > 0) {
          doneT -= dt;
          if (doneT <= 0) celebrate('boop', 'Boop-tastic!', 'You tickled all the lemmings!');
        } else {
          spawnT -= dt;
          const maxUp = count < 5 ? 1 : count < 10 ? 2 : 3;
          const active = holes.filter(h => h.who).length;
          if (spawnT <= 0 && active < maxUp) {
            const empty = holes.filter(h => !h.who);
            const h = pick(empty);
            h.who = count > 2 && Math.random() < 0.18 ? 'bear' : 'lem';
            h.phase = 'up'; h.up = 0; h.booped = false;
            h.stay = Math.max(1.1, 2.3 - count * 0.06);
            h.color = pick(LEMMING_COLORS); h.dir = pick([1, -1]); h.seed = rand(0, 10);
            spawnT = rand(0.4, 0.9);
            sfx.pop();
            puff(h.x, h.y - 4, 5, 60);
          }
        }
        for (const h of holes) {
          if (!h.who) continue;
          if (h.phase === 'up') { h.up += dt * 5; if (h.up >= 1) { h.up = 1; h.phase = 'stay'; } }
          else if (h.phase === 'stay') { h.stay -= dt; if (h.stay <= 0) h.phase = 'down'; }
          else { h.up -= dt * 4; if (h.up <= 0) { h.up = 0; h.who = null; } }
        }
      },
      render() {
        drawBackground();
        // grassy meadow full of burrows
        ctx.fillStyle = '#7fcf6a';
        ctx.beginPath(); ctx.moveTo(0, 250);
        for (let x = 0; x <= W; x += 30) ctx.lineTo(x, 240 + Math.sin(x / 90) * 12);
        ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
        ctx.fillStyle = '#6cc25f'; ctx.fillRect(0, 385, W, H - 385);
        drawFlowers(260, 100);
        for (const h of holes) {
          // stretch tall while springing up, squash flat for a moment when booped
          const squash = h.phase === 'up' ? -0.15 * (1 - h.up) : h.booped && h.phase === 'stay' && h.stay > 0.3 ? 0.16 : 0;
          drawHole(h.x, h.y, h.up, h.who === 'lem'
            ? (x, y) => drawLemmingAt(x, y, 2.2, { color: h.color, dir: h.dir, seed: h.seed, squash, face: h.booped ? 'happy' : undefined })
            : h.who === 'bear'
              // Grizzly waves; if he gets booped he scratches his head, puzzled
              ? (x, y) => drawBear(x, y, 0.62, { pose: h.booped ? 'scratch' : 'up', squash })
              : null);
        }
        drawProgress((x, y) => drawLemmingAt(x, y + 14, 0.9, { color: '#e8a35c', face: 'happy' }), count, GOAL);
      },
      pointer(p) {
        if (doneT > 0) return;
        for (const h of holes) {
          if (!h.who || h.booped || h.up < 0.4) continue;
          if (Math.hypot(p.x - h.x, p.y - (h.y - 50 * h.up)) < 72) {
            h.booped = true; h.phase = 'stay'; h.stay = 0.5;
            if (h.who === 'lem') {
              count++;
              sfx.giggle();
              burst(h.x, h.y - 70, '#ff5c8a', 8, 'heart');
              floatText('+1', h.x + 40, h.y - 100, '#ffd93d');
              if (count >= GOAL) doneT = 0.8;
            } else {
              sfx.oops();
              floatText("That's Grizzly!", h.x, h.y - 140, '#fff', 28);
            }
            return;
          }
        }
      },
    };
  })();

  // ---------------------------------------------------------------------
  //  Game 3: Match — memory pairs
  // ---------------------------------------------------------------------
  S.match = (() => {
    const FACES = ['bear', 'lemming', 'honey', 'berries', 'apple', 'fish'];
    const CW = 150, CH = 130, GAP = 18, X0 = (W - (4 * CW + 3 * GAP)) / 2, Y0 = 84;
    let cards = [], open = [], lockT = 0, pairs = 0, doneT = 0;

    function drawFace(f, x, y) {
      if (f === 'bear') drawBear(x, y + 44, 0.45, { happy: true });
      else if (f === 'lemming') drawLemmingAt(x, y + 38, 2, { color: '#e8a35c' });
      else drawTreat(f, x, y + 4, 0, 2.2);
    }
    return {
      start() {
        const deck = shuffle([...FACES, ...FACES]);
        cards = deck.map((f, i) => ({
          f, x: X0 + (i % 4) * (CW + GAP) + CW / 2, y: Y0 + Math.floor(i / 4) * (CH + GAP) + CH / 2,
          flip: 0, target: 0, matched: false, shake: 0,
        }));
        open = []; lockT = 0; pairs = 0; doneT = 0;
      },
      update(dt) {
        for (const c of cards) {
          c.flip += Math.sign(c.target - c.flip) * Math.min(Math.abs(c.target - c.flip), dt * 5);
          c.shake = Math.max(0, c.shake - dt);
        }
        if (overlay) return;
        if (lockT > 0) { lockT -= dt; if (lockT <= 0) { open.forEach(c => { c.target = 0; }); open = []; sfx.flip(); } }
        if (doneT > 0) { doneT -= dt; if (doneT <= 0) celebrate('match', 'Super memory!', 'You found all the pairs!'); }
      },
      render() {
        drawBackground();
        for (const c of cards) {
          const sx = Math.max(0.03, Math.abs(Math.cos(c.flip * Math.PI)));
          const front = c.flip > 0.5;
          ctx.save();
          ctx.translate(c.x + (c.shake ? Math.sin(c.shake * 40) * 5 : 0), c.y + (c.matched ? Math.sin(time * 3 + c.x) * 3 : 0));
          ctx.scale(sx, 1);
          roundRect(-CW / 2, -CH / 2 + 6, CW, CH, 16); ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fill();
          roundRect(-CW / 2, -CH / 2, CW, CH, 16);
          if (front) {
            ctx.fillStyle = '#fff8e7'; ctx.fill();
            ctx.lineWidth = 6; ctx.strokeStyle = c.matched ? '#ffd93d' : '#fff'; ctx.stroke();
            drawFace(c.f, 0, 0);
          } else {
            ctx.fillStyle = '#3a8f52'; ctx.fill();
            ctx.lineWidth = 6; ctx.strokeStyle = '#fff'; ctx.stroke();
            // paw print
            ellipse(0, 12, 22, 18, '#56bb6d');
            [[-24, -12], [-9, -26], [9, -26], [24, -12]].forEach(([px, py]) => circle(px, py, 9, '#56bb6d'));
          }
          ctx.restore();
        }
        drawProgress((x, y) => drawStar(x, y, 16, '#ffd93d'), pairs, FACES.length);
      },
      pointer(p) {
        if (lockT > 0 || doneT > 0) return;
        const c = cards.find(k => Math.abs(p.x - k.x) < CW / 2 && Math.abs(p.y - k.y) < CH / 2);
        if (!c || c.matched || c.target === 1) return;
        c.target = 1; sfx.flip(); open.push(c);
        if (open.length === 2) {
          const [a, b] = open;
          if (a.f === b.f) {
            a.matched = b.matched = true; open = []; pairs++;
            setTimeout(() => { sfx.catch(); burst(a.x, a.y, '#ffd93d', 10); burst(b.x, b.y, '#ffd93d', 10); }, 200);
            if (pairs === FACES.length) doneT = 1.2;
          } else {
            lockT = 1.1;
            setTimeout(() => { a.shake = b.shake = 0.3; sfx.nope(); }, 250);
          }
        }
      },
    };
  })();

  // ---------------------------------------------------------------------
  //  Shared pieces for the number games (Count, Add, Take Away)
  // ---------------------------------------------------------------------
  // Three answer choices: the right one plus two nearby numbers in [min, max].
  function pickChoices(answer, min, max) {
    const set = new Set([answer]);
    while (set.size < 3) { const n = answer + pick([-2, -1, 1, 2]); if (n >= min && n <= max) set.add(n); }
    return shuffle([...set]);
  }
  // Big round number buttons. q = { choices, xs, y, r, wrong, answer, solved, color }
  function drawChoices(q) {
    q.choices.forEach((n, i) => {
      const x = q.xs[i], isWrong = q.wrong.has(n), isRight = q.solved && n === q.answer;
      const s = isRight ? 1.15 + Math.sin(time * 8) * 0.05 : hot(x - q.r, q.y - q.r, q.r * 2, q.r * 2) && !isWrong ? 1.07 : 1;
      ctx.save(); ctx.translate(x, q.y); ctx.scale(s, s);
      ctx.globalAlpha = isWrong || (q.solved && !isRight) ? 0.35 : 1;
      circle(0, 6, q.r, 'rgba(0,0,0,.25)');
      circle(0, 0, q.r, isRight ? '#4caf50' : q.color);
      ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, q.r, 0, Math.PI * 2); ctx.stroke();
      text(String(n), 0, 3, q.r * 1.1, '#fff', 'rgba(40,0,80,.6)');
      ctx.restore();
    });
    ctx.globalAlpha = 1;
  }
  // Index of the choice button under p, or -1.
  function hitChoice(p, xs, y, r) {
    return xs.findIndex(x => Math.hypot(p.x - x, p.y - y) < r + 8);
  }
  // White bubble with a number, shown over things the child has tapped to count.
  function drawCountBadge(x, y, n, color) {
    circle(x, y, 18, '#fff');
    text(String(n), x, y + 1, 26, color, '#fff');
  }
  // Hop physics for tappable lemmings and pots: jy = height offset, jv = speed, land = squash timer.
  function updateHop(it, dt) {
    it.land = Math.max(0, (it.land || 0) - dt);
    if (it.jy < 0 || it.jv < 0) {
      it.jv += 1300 * dt; it.jy += it.jv * dt;
      if (it.jy > 0) { it.jy = 0; it.jv = 0; it.land = 0.15; }
    }
  }
  // Stretch tall in the air, squash flat for a moment after landing.
  function hopSquash(it) { return it.jy < 0 ? -0.1 : it.land > 0 ? it.land : 0; }
  function drawRoundStars(done, total) {
    for (let i = 0; i < total; i++) drawStar(W / 2 - (total - 1) * 20 + i * 40, 38, 16, i < done ? '#ffd93d' : 'rgba(255,255,255,.7)');
  }

  // ---------------------------------------------------------------------
  //  Game 4: Count — how many lemmings came to visit?
  // ---------------------------------------------------------------------
  S.count = (() => {
    const RANGES = [[2, 3], [3, 4], [4, 6], [5, 7], [6, 9]];
    const CHOICE_X = [430, 590, 750], CHOICE_Y = 195, CHOICE_R = 55;
    let round = 0, target = 0, lems = [], phase = 'walk', choices = [], wrong = new Set(), tapN = 0, timer = 0, puzzledT = 0;

    function newRound() {
      puzzledT = 0;
      const [a, b] = RANGES[round];
      target = randInt(a, b);
      const span = Math.min(80 * (target - 1), 620);
      const startX = 560 - span / 2;
      lems = [];
      for (let i = 0; i < target; i++) {
        lems.push({ x: -60 - i * 80, tx: target === 1 ? 560 : startX + i * span / (target - 1), color: pick(LEMMING_COLORS),
          step: rand(0, 6), hop: 0, jy: 0, jv: 0, num: 0, seed: rand(0, 10) });
      }
      choices = pickChoices(target, 1, 10);
      wrong = new Set(); tapN = 0; phase = 'walk';
    }
    function jump(l) { if (l.jy === 0) l.jv = -320; }

    return {
      start() { round = 0; newRound(); },
      update(dt) {
        for (const l of lems) {
          l.step += dt * 14;
          if (l.x < l.tx) {
            l.x = Math.min(l.tx, l.x + 330 * dt); l.hop = Math.abs(Math.sin(l.step)) * 5;
            if (l.x === l.tx) puff(l.x - 15, GROUND, 3, 40); // skid to a stop
          } else l.hop = 0;
          updateHop(l, dt);
        }
        puzzledT = Math.max(0, puzzledT - dt);
        if (overlay) return;
        if (phase === 'walk' && lems.every(l => l.x >= l.tx)) { phase = 'ask'; say('How many lemmings?'); }
        if (phase === 'right') {
          if (Math.random() < 0.15) jump(pick(lems));
          timer -= dt;
          if (timer <= 0) {
            round++;
            if (round >= RANGES.length) { phase = 'done'; celebrate('count', 'Super counting!', 'You counted every lemming!'); }
            else newRound();
          }
        }
      },
      render() {
        drawBackground();
        const cheering = phase === 'right' || phase === 'done';
        drawBear(95, GROUND, 0.85, { happy: cheering, dance: cheering, pose: puzzledT > 0 ? 'scratch' : undefined });

        if (phase !== 'walk') {
          // speech bubble
          const msg = cheering ? `Yes! ${target}!` : puzzledT > 0 ? 'Hmm...' : 'How many?';
          roundRect(150, 205, 190, 62, 26); ctx.fillStyle = '#fff'; ctx.fill();
          ctx.beginPath(); ctx.moveTo(165, 255); ctx.lineTo(135, 290); ctx.lineTo(190, 262); ctx.fill();
          text(msg, 245, 236, 28, '#9b5de5', '#fff');

          drawChoices({ choices, xs: CHOICE_X, y: CHOICE_Y, r: CHOICE_R, wrong, answer: target, solved: cheering, color: '#9b5de5' });
        }

        for (const l of lems) {
          drawLemmingAt(l.x, GROUND - l.hop + l.jy, 1.6, { color: l.color, step: l.step, seed: l.seed, squash: hopSquash(l), face: cheering ? 'happy' : undefined });
          if (l.num) drawCountBadge(l.x, GROUND - 92 + l.jy, l.num, '#9b5de5');
        }
        drawRoundStars(round, RANGES.length);
      },
      pointer(p) {
        if (phase === 'ask') {
          const i = hitChoice(p, CHOICE_X, CHOICE_Y, CHOICE_R);
          if (i >= 0) {
            const n = choices[i];
            if (wrong.has(n)) return;
            if (n === target) {
              phase = 'right'; timer = 2.2;
              sfx.yay(); say(`Yes! ${target} lemmings!`);
              lems.forEach(jump);
              burst(CHOICE_X[i], CHOICE_Y, '#ffd93d', 16);
            } else {
              wrong.add(n); sfx.nope(); say('Try again!'); puzzledT = 1.4;
            }
            return;
          }
        }
        if (phase === 'done') return;
        for (const l of lems) {
          if (Math.abs(p.x - l.x) < 40 && p.y > GROUND - 110 && p.y < GROUND + 15) {
            if (!l.num) { tapN++; l.num = tapN; sfx.count(tapN); say(String(tapN)); }
            jump(l);
            return;
          }
        }
      },
    };
  })();

  // ---------------------------------------------------------------------
  //  Games 5 & 6: Add and Take Away — single-digit sums shown with pictures
  // ---------------------------------------------------------------------
  //  Add:       two groups of lemmings walk in, "3 + 2 = ?", groups join on a right answer.
  //  Take Away: Grizzly's honey pots appear, lemmings run off with some, "5 − 2 = ?".
  function makeMathGame(mode) {
    const ADD = mode === 'add';
    const ROUNDS = 5;
    const ADD_MAX_SUM = [5, 6, 8, 10, 10];                      // answers never go above 10
    const SUB_START = [[3, 5], [4, 6], [5, 7], [6, 9], [7, 9]]; // how many pots to start with
    const CHOICE_X = [400, 560, 720], CHOICE_Y = 252, CHOICE_R = 50;
    const COLOR = ADD ? '#4caf50' : '#ff8c42', INK = ADD ? '#2e7d32' : '#b85a12';
    const SPACING = ADD ? 64 : 72, PLUS_GAP = 96, CENTER = 560;
    let round = 0, a = 0, b = 0, answer = 0, phase = 'intro', timer = 0, tapN = 0, plusX = 0, plusAlpha = 1, puzzledT = 0;
    let items = [], thieves = [], choices = [], wrong = new Set();

    function jump(it) { if (it.jy === 0) it.jv = -320; }

    function newRound() {
      if (ADD) {
        const sum = randInt(2, ADD_MAX_SUM[round]);
        a = randInt(1, sum - 1); b = sum - a; answer = sum;
      } else {
        const [lo, hi] = SUB_START[round];
        a = randInt(lo, hi); b = randInt(1, Math.min(a - 1, 4)); answer = a - b;
      }
      items = []; thieves = []; tapN = 0; wrong = new Set(); plusAlpha = 1; puzzledT = 0;
      choices = pickChoices(answer, 0, 10);
      phase = 'intro';
      const base = { jy: 0, jv: 0, num: 0, hop: 0 };
      if (ADD) {
        const width = (a - 1) * SPACING + PLUS_GAP + (b - 1) * SPACING;
        const x0 = CENTER - width / 2;
        plusX = x0 + (a - 1) * SPACING + PLUS_GAP / 2;
        for (let i = 0; i < a; i++) {
          const tx = x0 + i * SPACING;
          items.push(Object.assign({ group: 0, tx, x: tx - 700, color: '#e8a35c', dir: 1, step: rand(0, 6), seed: rand(0, 10) }, base));
        }
        for (let j = 0; j < b; j++) {
          const tx = plusX + PLUS_GAP / 2 + j * SPACING;
          items.push(Object.assign({ group: 1, tx, x: tx + 700, color: '#f5e6c8', dir: -1, step: rand(0, 6), seed: rand(0, 10) }, base));
        }
      } else {
        const x0 = CENTER - (a - 1) * SPACING / 2;
        for (let i = 0; i < a; i++) items.push(Object.assign({ x: x0 + i * SPACING, pop: -i * 0.12, gone: false }, base));
        timer = 1.6 + a * 0.12;
        say(`Grizzly has ${a} honey pots.`, true);
      }
    }

    return {
      start() { round = 0; newRound(); },
      update(dt) {
        for (const it of items) {
          if (ADD) {
            it.step += dt * 14;
            const d = it.tx - it.x;
            if (Math.abs(d) > 1) { it.x += Math.sign(d) * Math.min(Math.abs(d), 380 * dt); it.hop = Math.abs(Math.sin(it.step)) * 5; }
            else { if (it.hop) puff(it.x - it.dir * 15, GROUND, 3, 40); it.x = it.tx; it.hop = 0; } // skid to a stop
          } else {
            it.pop = Math.min(1, it.pop + dt * 3);
          }
          updateHop(it, dt);
        }
        for (const t of thieves) {
          t.step += dt * 14;
          if (t.state === 'in') {
            t.x -= 300 * dt;
            if (t.x <= t.target.x) { t.x = t.target.x; t.target.gone = true; t.state = 'out'; sfx.giggle(); puff(t.x, GROUND, 5); }
          } else {
            t.x += 360 * dt;
            if (t.x > W + 60) t.dead = true;
          }
        }
        thieves = thieves.filter(t => !t.dead);
        puzzledT = Math.max(0, puzzledT - dt);
        if (overlay) return;

        if (phase === 'intro') {
          if (ADD && items.every(it => it.x === it.tx)) {
            phase = 'ask';
            say(`${a} plus ${b}. How many in all?`, true);
          } else if (!ADD) {
            timer -= dt;
            if (timer <= 0) {
              for (let k = 0; k < b; k++) thieves.push({ x: W + 40 + k * 90, target: items[a - 1 - k], state: 'in', step: rand(0, 6), seed: rand(0, 10) });
              phase = 'steal';
              say(b === 1 ? 'Oh no! A lemming takes 1 away!' : `Oh no! Lemmings take ${b} away!`, true);
            }
          }
        } else if (phase === 'steal' && thieves.length === 0) {
          phase = 'ask';
          say('How many are left?', true);
        } else if (phase === 'right') {
          plusAlpha = Math.max(0, plusAlpha - dt * 2);
          const standing = items.filter(it => !it.gone);
          if (Math.random() < 0.12 && standing.length) jump(pick(standing));
          timer -= dt;
          if (timer <= 0) {
            round++;
            if (round >= ROUNDS) {
              phase = 'done';
              if (ADD) celebrate('add', 'Adding star!', 'You can add!');
              else celebrate('sub', 'Take-away hero!', 'You can take away!');
            } else newRound();
          }
        }
      },
      render() {
        drawBackground();
        const solved = phase === 'right' || phase === 'done';
        drawBear(85, GROUND, 0.75, { happy: solved, dance: solved, pose: puzzledT > 0 ? 'scratch' : undefined });

        // the number sentence
        roundRect(CENTER - 180, 68, 360, 78, 32); ctx.fillStyle = 'rgba(255,255,255,.94)'; ctx.fill();
        ctx.lineWidth = 6; ctx.strokeStyle = solved ? '#4caf50' : COLOR; ctx.stroke();
        text(`${a} ${ADD ? '+' : '−'} ${b} = ${solved ? answer : '?'}`, CENTER, 108, 56, INK, '#fff');

        if (phase === 'ask' || solved) {
          drawChoices({ choices, xs: CHOICE_X, y: CHOICE_Y, r: CHOICE_R, wrong, answer, solved, color: COLOR });
        }

        if (ADD) {
          ctx.globalAlpha = plusAlpha;
          text('+', plusX, GROUND - 32, 60, '#fff', INK);
          ctx.globalAlpha = 1;
          for (const it of items) {
            drawLemmingAt(it.x, GROUND - it.hop + it.jy, 1.3, { color: it.color, dir: it.dir, step: it.hop ? it.step : 0, seed: it.seed, squash: hopSquash(it), face: solved ? 'happy' : undefined });
            if (it.num) drawCountBadge(it.x, GROUND - 80 + it.jy, it.num, INK);
          }
        } else {
          for (const it of items) {
            if (it.gone) {
              // faded outline where a pot was taken
              ctx.globalAlpha = 0.25; drawTreat('honey', it.x, GROUND - 26, 0, 1.7); ctx.globalAlpha = 1;
              continue;
            }
            if (it.pop <= 0) continue;
            drawTreat('honey', it.x, GROUND - 26 + it.jy, 0, 1.7 * Math.sin(it.pop * Math.PI / 2));
            if (it.num) drawCountBadge(it.x, GROUND - 88 + it.jy, it.num, INK);
          }
          for (const t of thieves) {
            const out = t.state === 'out';
            drawLemmingAt(t.x, GROUND - Math.abs(Math.sin(t.step)) * 4, 1.3, { color: '#d98b4a', dir: out ? 1 : -1, step: t.step, seed: t.seed, carry: out });
            if (out) drawTreat('honey', t.x, GROUND - 68, 0, 1.2);
          }
        }
        drawRoundStars(round, ROUNDS);
      },
      pointer(p) {
        if (phase !== 'ask') return;
        const i = hitChoice(p, CHOICE_X, CHOICE_Y, CHOICE_R);
        if (i >= 0) {
          const n = choices[i];
          if (wrong.has(n)) return;
          if (n === answer) {
            phase = 'right'; timer = 2.8;
            sfx.yay();
            say(ADD ? `${a} plus ${b} is ${answer}!` : `${a} take away ${b} is ${answer}!`);
            burst(CHOICE_X[i], CHOICE_Y, '#ffd93d', 16);
            if (ADD) items.forEach(it => { if (it.group === 1) it.tx -= PLUS_GAP - SPACING; });
            items.forEach(it => { if (!it.gone) jump(it); });
          } else {
            wrong.add(n); sfx.nope(); say('Try again!'); puzzledT = 1.4;
          }
          return;
        }
        // tap things to count them
        for (const it of items) {
          if (it.gone) continue;
          if (Math.abs(p.x - it.x) < 34 && p.y > GROUND - 100 && p.y < GROUND + 15) {
            if (!it.num) { tapN++; it.num = tapN; sfx.count(tapN); say(String(tapN)); }
            jump(it);
            return;
          }
        }
      },
    };
  }
  S.add = makeMathGame('add');
  S.sub = makeMathGame('sub');

  // =====================================================================
  //  More games (page 2 and 3 of the menu)
  // =====================================================================
  // @@NEW-GAMES@@

  // =====================================================================
  //  Input
  // =====================================================================
  function toGame(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }
  function hitButton(p) {
    for (let i = buttons.length - 1; i >= 0; i--) {
      const b = buttons[i];
      if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) return b;
    }
    return null;
  }

  // Buttons fire when the finger lifts (pointerup), because iOS only lets sound and
  // speech start from that part of a tap. Game taps (booping, catching) still react
  // on pointerdown so they feel instant.
  let pressedButton = false;
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    initAudio();
    const p = toGame(e); pointer.x = p.x; pointer.y = p.y; pointer.down = true;
    pressedButton = !!hitButton(p);
    if (pressedButton) return;
    if (!overlay && scene.pointer) scene.pointer(p);
  });
  window.addEventListener('pointermove', e => {
    const p = toGame(e); pointer.x = p.x; pointer.y = p.y;
    if (pointer.down && !pressedButton && !overlay && scene.drag) scene.drag(p);
  });
  window.addEventListener('pointerup', e => {
    initAudio(true);
    const wasDown = pointer.down;
    pointer.down = false;
    if (!pressedButton) {
      // scenes that drag things (Bridge, Maze...) hear about the finger lifting
      if (wasDown && !overlay && scene.release) scene.release(toGame(e));
      return;
    }
    pressedButton = false;
    const b = hitButton(toGame(e));
    if (b) { sfx.click(); b.action(); }
  });
  window.addEventListener('pointercancel', () => { pointer.down = false; pressedButton = false; });
  // Extra unlock points for iOS, which treats touchend and click as real gestures.
  window.addEventListener('touchend', () => initAudio(true), { passive: true });
  window.addEventListener('click', () => initAudio(true));

  window.addEventListener('keydown', e => {
    initAudio(true);
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keys.left = true; e.preventDefault(); }
    if (k === 'ArrowRight' || k === 'd' || k === 'D') { keys.right = true; e.preventDefault(); }
    if ((k === 'Enter' || k === ' ') && overlay) { e.preventDefault(); sfx.click(); overlay.buttons[0].action(); }
    if (k === 'Escape' && scene !== S.menu) go('menu');
    if (scene === S.menu && (k === 'ArrowLeft' || k === 'ArrowRight')) flipPage(k === 'ArrowLeft' ? -1 : 1);
    if (k === 'm' || k === 'M') muted = !muted;
  });
  window.addEventListener('keyup', e => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
    if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  });
  window.addEventListener('blur', () => { keys.left = keys.right = false; pointer.down = false; });

  // =====================================================================
  //  Main loop
  // =====================================================================
  function update(dt) {
    time += dt;
    for (const c of clouds) { c.x += c.v * dt; if (c.x > W + 120) c.x = -120; }
    updateParticles(dt);
    if (overlay && overlay.win && Math.random() < 0.4) {
      particles.push({ x: rand(0, W), y: -10, vx: rand(-40, 40), vy: rand(50, 150), life: 3, max: 3,
        color: pick(['#ff5c8a', '#ffd93d', '#6bcb77', '#4d96ff', '#c77dff']), kind: 'confetti', size: rand(6, 11) });
    }
    scene.update(dt);
    updateMusic();
  }
  function render() {
    buttons.length = 0;
    ctx.clearRect(0, 0, W, H);
    scene.render();
    if (overlay) drawOverlay();
    drawParticles();
    if (scene !== S.menu) drawHome();
    drawMute();
  }

  go('menu');
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Small hook for automated testing.
  window.__game = {
    go,
    get scene() { return Object.keys(S).find(k => S[k] === scene); },
    get overlay() { return overlay && overlay.title; },
    get audio() { return audio ? audio.state : 'none'; },
    get music() { return { on: musicOn, step: musicStep, level: musicLevel, song: playingKey }; },
    songs: SONGS,
    art: { ctx, drawBear, drawLemmingAt, drawTreat }, // for drawing pose sheets in tests
  };
})();
</script>
</body>
</html>
